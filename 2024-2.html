qzzMR/vkTxjQf+PSH/AHP6V30H/IMh/wB9f5iiivRfQ+yrfwjhrz/kcNW/7bf+hCt74Tf8la8c/wDXpZ/yFFFGY/woeq/I+Wqbx9f8z2Fu9Mbov0oorzTqQj9RTX+4v1oooLQjdB9aQdH+lFFOWxXQ5rxp/wAgy5/64f8As1cZpP8AqdB/67D+tFFenT/gL5il9n1LMP8AyM1r/wBhGX/0Bat+GP8Aj2vv+uEv/oRooqp7P5fkU/4R0E3/AB4R/wDXMfyNXb7/AJBlr/11H/oNFFedR3RFTZHH2P8AyLEH/X3J/wCjak8HdZP+vyX/ANDNFFdi/gv1Y18Zq+Of+RR0r/en/ma5rwv/AMh6L/r2P8zRRVYb+G/mXS/3eX+L/M73X/8AkFWv/Xsn/oBrmNG/5Atn/wBtf50UVFL/AHb5s5Vt/Xc6ew/1sf8AwOo5v+P62/6+pP8A0W1FFckdyZ/EYLf8jfff9ep/9DrO0T/Uy/8AX6P5tRRXXL+G/kerV/hv0ON0/wD4+R/1+J/6Mauw8Cf8fUn/AFzH/ow0UV0Vv4DPLo9PmWtc/wCRj0f/AK7SfzFX5v8AXL/1+j+tFFc8vhj6G6NLwV/yLEP/AF2NdEfvN+FFFc1f+JIiG39eQH7x+lYvjL/kA3//AFyn/wDQDRRSofHH1RM9ji737sP/AF7T/wDoCVa8Cf8AIxW//Xu386KK6Z/wpne9peh6afutSdx9KKK8yJ562Im++f8AdrlfE33T9EoorWl8ZtAoN/x/D/cj/kawrH/kT7b/AK+pf/RlFFewtv8At4uv09De0D/j3sv+ujfzau1g/wCQmPon8zRRXj4jc5qhPqH+qf6t/OqEv+qu/wDe/wDZKKKgyjseV63/AMjjon/XJf5mun8Sf6qz/wB//wBlaiivUqfBA6aPx/12EtP+Pqz/AOuSf+gVfvv+QPD9P/ZDRRUR3Xr+ppL4vkZOvf8AILi/687aqWr/APIR1n/r7n/mlFFFPdE4fd+g61/1+mf7/wDVq6eb/j+/76oopYr4jGn8Jm6r/qIf93/2U1U8I/8AIW0b/rpc/wDotaKK6MN/Dfo/yZFfdHReGf8Aj8P/AF/N/wChrRRRXi4jdGGb/wAb5H//2Q=="], "conceito": "Hashimoto: infiltrado linfoplasmocitário difuso com centros germinativos, folículos atróficos e células oxifílicas (de Hürthle), levando a hipotireoidismo. Graves: hiperplasia difusa de folículos com células altas e colunares e papilas, por anticorpo estimulador do receptor de TSH, levando a hipertireoidismo.", "conduta": "Hashimoto: levotiroxina. Graves: tionamida, radioiodo ou cirurgia; TRAb confirma.", "pegadinha": "Não confundir o mecanismo: destruição folicular (Hashimoto) versus estimulação do receptor de TSH (Graves).", "ref": "Kumar V. Robbins Patologia Básica, 10ª ed. (2018), citada no gabarito. Kumar V, Abbas A, Aster J. Robbins & Cotran: Patologia, 10ª ed. (2023).", "cards": [["Compare a histologia de Hashimoto e de Graves.", "Hashimoto: infiltrado {{c1::linfoplasmocitário}} com centros germinativos e células de {{c1::Hürthle}} (hipotireoidismo). Graves: células {{c1::altas e colunares}} com papilas, por anticorpo estimulador do receptor de {{c1::TSH}} (hipertireoidismo)."]], "nota": "", "esperada": "- Na Tireoidite de Hashimoto, o exame microscópico revela uma infiltração generalizada do parênquima por um infiltrado inflamatório mononuclear contendo pequenos linfócitos, plasmócitos e centros germinativos bem desenvolvidos. Os folículos tireoidianos estão atróficos e são revestidos em muitas áreas por células oxifílicas, ou de Hürthle. Esta é uma resposta metaplásica do epitélio folicular cubóide baixo normal à lesão em curso. A atrofia de folículos e a perda das células foliculares pelo processo de metaplasia levam à diminuição de hormônios tireoidianos, resultando no quadro clínico de hipotireoidismo. - Na Doença de Graves, há a hipertrofia e hiperplasia difusa dos folículos tireoidianos, e as células foliculares são altas, colunares e mais compactas, muitas vezes resultando na formação de pequenas papilas, que se projetam para o lúmen folicular. Tais alterações são resultantes da atuação dos autoanticorpos contra o receptor de TSH que mimetizam a ação de TSH e ativam receptores de TSH nas células epiteliais da tireóide, levando à elevação dos hormônios tireoidianos e ao quadro clínico de hipertireoidismo. Referência: Kumar, Vinay. Robbins Patologia Básica. Disponível em: Minha Biblioteca, (10th edição). Grupo GEN, 2018. (pgs 757-761)", "partes": ["Hashimoto: histopatologia e quadro clínico (hipotireoidismo)", "Graves: histopatologia e quadro clínico (hipertireoidismo)"]}, {"n": 34, "area": "Nefrologia", "tema": "Hematúria glomerular: características", "assunto": "Glomerulopatias e síndromes nefrótica/nefrítica", "macro": "Nefrologia", "raciocinio": "Laboratório", "tipo": "mcq", "enunciado": "Sobre as características da hematúria glomerular, é correto afirmar que:", "imagens": [], "conceito": "Hematúria glomerular: hemácias dismórficas (acantócitos), cilindros hemáticos, proteinúria associada, urina cor de coca-cola; pode ser micro ou macroscópica. Não glomerular: hemácias isomórficas, coágulos, sem proteinúria relevante.", "conduta": "Sedimento urinário com análise de dismorfismo, proteinúria, função renal e complemento conforme suspeita; biópsia quando indicada.", "pegadinha": "Complemento baixo ocorre em algumas causas (GNPE, lúpus), não em todas; a leucocitúria maior que a hematúria sugere infecção.", "ref": "KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases (Kidney Int 2021;100(4S):S1-S276). Harrison: Medicina Interna, 21ª ed. (2022).", "cards": [["Como distinguir hematúria glomerular da não glomerular?", "Glomerular: hemácias {{c1::dismórficas}}, cilindros {{c1::hemáticos}} e proteinúria; pode ser micro ou macroscópica. Não glomerular: hemácias isomórficas e coágulos."]], "nota": "", "opcoes": [{"l": "A", "t": "A hematúria glomerular é sempre macroscópica, enquanto a não glomerular é microscópica."}, {"l": "B", "t": "Eritrócitos dismórficos são frequentemente observados na hematúria glomerular devido ao dano à membrana basal glomerular."}, {"l": "C", "t": "Hematúria glomerular está sempre associada à redução do complemento sérico."}, {"l": "D", "t": "A hematúria glomerular apresenta leucócitos em maior número que hemácias."}], "certas": ["B"], "comentarios": {"A": "Incorreta. A glomerular pode ser micro ou macroscópica.", "B": "Correta. Dismorfismo reflete a passagem pela MBG lesada.", "C": "Incorreta. O complemento é normal em IgA, anti-MBG e ANCA.", "D": "Incorreta. Leucócitos em maior número que hemácias sugerem infecção."}, "feedback": "Na hematúria glomerular, os eritrócitos dismórficos resultam de alterações estruturais ao atravessarem a membrana basal danificada."}, {"n": 35, "area": "Nefrologia", "tema": "Glomerulonefrite pós-estreptocócica", "assunto": "Glomerulopatias e síndromes nefrótica/nefrítica", "macro": "Nefrologia", "raciocinio": "Diagnóstico", "tipo": "aberta", "enunciado": "Um menino de 7 anos é levado à emergência com queixas de edema periorbital ao acordar, edema de membros inferiores e urina com coloração escurecida com inicio há 1 dia. A mãe relata que a criança urinou cerca de 400ml nas ultimas 24 horas. Relata ainda que há cerca de duas semanas, ele teve uma \"dor de garganta\" que melhorou espontaneamente. No exame físico, observa-se edema periorbital e de membros inferiores, estertores crepitantes em bases pulmonares e pressão arterial de 140x90 mmHg (elevada para a idade). Não há febre ou outros sinais de infecção ativa.\nExames: Sumário de urina: densidade: 1025, pH: 5,5; leucócitos: 25/campo, hemácias: 45/campo, proteína +, cilindros hemáticos. Ureia: 42 mg/dl e creatinina: 1,2 mg/dl. Hemograma: sem alterações. Sobre o caso acima responda: a) Com base nos dados do caso clínico, qual o diagnóstico etiológico mais provável?\nb) Cite outros 3 exames laboratoriais que devem ser solicitados para confirmar este diagnóstico e descreva a alteração esperada.", "imagens": [], "conceito": "Criança com edema, urina escura, hipertensão, oligúria e cilindros hemáticos duas semanas após faringite: síndrome nefrítica por GNPE. C3 baixo (via alternativa) com C4 normal, ASLO ou anti-DNAse B elevados, hematúria dismórfica e proteinúria subnefrótica.", "conduta": "Suporte: restrição de sal e água, diurético de alça se congestão, anti-hipertensivo; antibiótico para erradicar estreptococo se ainda houver infecção; C3 normaliza em 8 a 12 semanas (se não, reconsiderar).", "pegadinha": "C3 baixo por mais de 12 semanas sugere membranoproliferativa ou C3 glomerulopatia; C4 é normal na GNPE.", "ref": "KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases (Kidney Int 2021;100(4S):S1-S276). Nelson: Tratado de Pediatria, 21ª ed.", "cards": [["Quais exames confirmam a glomerulonefrite pós-estreptocócica?", "C3 {{c1::baixo}} com C4 {{c1::normal}}, {{c1::ASLO}} ou anti-DNAse B elevados, hematúria dismórfica; se o C3 não normaliza em 8 a 12 semanas, reconsiderar."]], "nota": "", "esperada": "a) Síndrome Nefritica por glomerulonefrite pós-estreptocócica (GNPE). b) Complemento C3 e C4. O C3 geralmente está reduzido na GNPE, enquanto o C4 está normal. CH50 também estará reduzido. - Pesquisa de hematuria dismorfica positiva - FAN - não reagente - descartar LES - Sorologias virais (HIV, HCV, HBV) - não reagentes - descartar causas infecciosas - Proteina de 24 h - quantificar proteinuria - Demonstração de uma infecção recente por estreptococos beta-hemolíticos do grupo A, que pode ser feita através de cultura positiva da garganta ou da pele ou testes sorológicos, como antiestreptolisina (ASLO) ou teste de estreptozima, anti DNAse B ou anti- hialuronidase.", "partes": ["a) Diagnóstico: síndrome nefrítica por GNPE", "b) Exame 1 e alteração esperada", "b) Exame 2 e alteração esperada", "b) Exame 3 e alteração esperada"]}, {"n": 36, "area": "Medicina de Família", "tema": "Síndrome consumptiva (caquexia): fisiopatologia", "assunto": "Clínica geral (consumptiva, linfonodomegalia)", "macro": "Clínica geral", "raciocinio": "Fisiopatologia", "tipo": "mcq", "enunciado": "Sobre a síndrome consumptiva, assinale a alternativa correta:", "imagens": [], "conceito": "A caquexia é síndrome metabólica multifatorial: inflamação sistêmica (TNF-alfa, IL-1, IL-6) causa catabolismo muscular e perda de massa magra (sarcopenia), com ou sem perda de gordura, e não é revertida só por nutrição. Anorexia é frequente, mas não obrigatória.", "conduta": "Tratar a causa (câncer, IC, DPOC, infecção crônica), suporte nutricional e exercício de resistência; avaliar sarcopenia.", "pegadinha": "Não é só falta de apetite ('anorexia') nem só má absorção; o mecanismo central é inflamatório e catabólico.", "ref": "Harrison: Medicina Interna, 21ª ed. (2022).", "cards": [["Qual o mecanismo da síndrome consumptiva (caquexia)?", "{{c1::Inflamação}} sistêmica (TNF-alfa, IL-1, IL-6) com catabolismo e perda de {{c1::massa magra}} (sarcopenia); não é só falta de apetite nem revertida só com nutrição."]], "nota": "", "opcoes": [{"l": "A", "t": "A fisiopatologia da síndrome consumptiva se dá por liberação de citocinas inflamatórias que levam ao consumo muscular"}, {"l": "B", "t": "Na síndrome consumptiva há tipicamente diminuição do apetite e portanto anorexia, o que leva o paciente ao emagrecimento intenso"}, {"l": "C", "t": "O principal diagnóstico etiológico de síndrome consumptiva são as doenças disabsortivas intestinais, que levam a redução do metabolismo"}, {"l": "D", "t": "A sarcopenia da síndrome consumptiva ocorre por depleção da massa magra corporal e a perda de peso intensa do paciente."}], "certas": ["D"], "comentarios": {"A": "Incorreta como descrição completa: a liberação de citocinas é parte do mecanismo, mas o gabarito destaca a sarcopenia por depleção da massa magra.", "B": "Incorreta. A anorexia costuma existir, mas não é obrigatória; o mecanismo central é o catabolismo.", "C": "Incorreta. As doenças disabsortivas são uma causa, mas não a principal.", "D": "Correta segundo o gabarito oficial."}}, {"n": 37, "area": "Nefrologia / Anatomia Patológica", "tema": "Síndrome nefrótica associada a neoplasia: achado histológico", "assunto": "Glomerulopatias e síndromes nefrótica/nefrítica", "macro": "Nefrologia", "raciocinio": "Patologia", "tipo": "mcq", "enunciado": "Paciente, masculino, 60 anos, tabagista pesado apresentando quadro de anarsarca iniciado há 2 meses. Exames laboratoriais evidenciaram Ur=35 mg/dl, Cr = 0,8 mg/dl, proteinúria de 24 horas de 8,5 g e albumina sérica=1,9 g/dl ( N: 3,5-4,5 g/dl). Durante sua investigação foi evidenciado nódulo pulmonar espiculado suspeito. Foi indicado realização de biópsia renal pelo Nefrologista. Qual o achado histopatológico mais provável na biópsia renal deste paciente? Escolha o item correto ( apenas uma resposta correta).", "imagens": [], "conceito": "Tabagista, nódulo pulmonar espiculado e síndrome nefrótica (proteinúria de 8,5 g/dia, albumina de 1,9): glomerulopatia membranosa paraneoplásica. Histologia: espessamento difuso da MBG; à IF, granular de IgG e C3; à ME, depósitos subepiteliais.", "conduta": "Diagnosticar a neoplasia e tratá-la; a remissão do tumor pode levar à remissão da nefropatia; medidas antiproteinúricas.", "pegadinha": "Crescentes em mais de 50% dos glomérulos definem glomerulonefrite crescêntica (rapidamente progressiva), não síndrome nefrótica pura.", "ref": "KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases (Kidney Int 2021;100(4S):S1-S276). Kumar V, Abbas A, Aster J. Robbins & Cotran: Patologia, 10ª ed. (2023).", "cards": [["Qual a síndrome nefrótica paraneoplásica no tabagista com nódulo pulmonar e qual a histologia?", "Glomerulopatia {{c1::membranosa}}: espessamento difuso da {{c1::MBG}}, IF granular de IgG e C3, depósitos subepiteliais."]], "nota": "", "opcoes": [{"l": "A", "t": "Proliferação de matriz e células mesangiais."}, {"l": "B", "t": "Espessamento difuso de membrana basal glomerular."}, {"l": "C", "t": "Crescentes celulares em mais de 50% dos glomérulos"}, {"l": "D", "t": "Glomeruloesclerose Segmentar e Focal"}], "certas": ["B"], "comentarios": {"A": "Incorreta. Proliferação mesangial é típica da nefropatia por IgA.", "B": "Correta. Espessamento difuso da MBG é o achado da membranosa.", "C": "Incorreta. Crescentes indicam glomerulonefrite rapidamente progressiva.", "D": "Incorreta. GESF tem esclerose segmentar; a associação com neoplasia é da membranosa."}, "feedback": "Paciente, masculino, 60 anos, com quadro de síndrome nefrótica (anasarca, hipoalbuminemia, proteinúria > 3,5g/d ). A glomerulopatia que mais se apresenta com síndrome nefrótica nesta faixa etária é a glomerulopatia membranosa, além disso a suspeita de neoplasia de pulmão fortalece ainda mais esta hipótese por tratar-se da glomerulopatia mais associada a tumores sólidos. O achado histopatologico na biópsia renal é o espessamento difuso de membrana basal glomerular."}, {"n": 38, "area": "Endocrinologia / Anatomia Patológica", "tema": "Feocromocitoma: origem celular e localização", "assunto": "Adrenal e feocromocitoma", "macro": "Endocrinologia", "raciocinio": "Fisiopatologia", "tipo": "aberta", "enunciado": "Em relação ao feocromocitoma, responda corretamente:\na) O feocromocitoma é uma neoplasia que se origina de qual célula? (33% do valor da questão)\nb) Em qual órgão o feocromocitoma se origina mais comumente? (33% do valor da questão)\nc) Cite outro órgão ou estrutura do corpo humano de onde os feocromocitomas também podem se originar, mesmo que recebam outro nome nestes casos. (33% do valor da questão)", "imagens": [], "conceito": "O feocromocitoma é tumor de células cromafins, mais comum na medula da adrenal. A regra dos 10 é aproximada: cerca de 10% extra-adrenais (paragangliomas: órgão de Zuckerkandl, corpo carotídeo), bilaterais, malignos e familiares.", "conduta": "Suspeita (HAS paroxística, cefaleia, sudorese, palpitações): metanefrinas plasmáticas livres ou urinárias, TC ou RM e, se necessário, imagem funcional; alfa-bloqueio antes do beta-bloqueio e cirurgia.", "pegadinha": "Linfonodos não são sítio de origem; sem alfa-bloqueio prévio, o beta-bloqueador pode causar crise hipertensiva.", "ref": "Kumar V. Robbins Patologia Básica, 10ª ed. (2018), p. 793, citada no gabarito. Lenders JWM et al. Endocrine Society Guideline on Pheochromocytoma and Paraganglioma (J Clin Endocrinol Metab 2014;99:1915-1942).", "cards": [["De que célula se origina o feocromocitoma e onde ocorre?", "De células {{c1::cromafins}}, mais comumente na medula da {{c1::adrenal}}; extra-adrenais são paragangliomas (órgão de {{c1::Zuckerkandl}}, corpo carotídeo)."], ["Qual a ordem de bloqueio antes da cirurgia do feocromocitoma?", "Bloqueio {{c1::alfa}} antes do {{c1::beta}}, para evitar crise hipertensiva."]], "nota": "", "esperada": "a) Os feocromocitomas são neoplasias compostas por células cromafins. b) Glândula adrenal ou suprarrenal (mais especificamente na medula). c) Dez porcento dos feocromocitomas são extra-adrenais, ocorrendo em parangânglios como o órgão de Zuckerkandl e o corpo carotídeo, onde geralmente são chamados paragangliomas.", "partes": ["a) Célula de origem: cromafim", "b) Órgão mais comum: adrenal (medula)", "c) Outro local: paragânglios (Zuckerkandl, corpo carotídeo)"]}, {"n": 39, "area": "Endocrinologia", "tema": "Crise tireotóxica (tempestade tireoidiana)", "assunto": "Tireoide: função e tireoidites", "macro": "Endocrinologia", "raciocinio": "Conduta", "tipo": "aberta", "enunciado": "Você atende uma mulher de 32 anos, previamente saudável, que se apresenta ao pronto-socorro com queixas de febre alta (39,5°C), taquicardia (FC 136 bpm), sudorese intensa, ansiedade e perda de peso recente. Ao exame físico, a paciente está agitada, ictérica (+/4+), com tremores finos em extremidades e exoftalmia. A história revela que ela foi diagnosticada com hipertireoidismo há seis meses e está em uso irregular de metimazol. Considerando o caso clínico apresentado, responda as questões abaixo:\na) Qual é o diagnóstico clínico da complicação apresentada pela paciente?\nb) Cite 2 medidas terapêuticas farmacológicas necessárias na abordagem inicial desta paciente.", "imagens": [], "conceito": "Tireotoxicose descompensada com febre, taquicardia acentuada, agitação, sinais de disfunção de órgãos e fator precipitante (aqui, uso irregular de metimazol). Mortalidade de 10 a 20% sem tratamento; diagnóstico clínico, com auxílio do escore de Burch-Wartofsky.", "conduta": "Terapia de suporte em UTI; betabloqueador (propranolol), tionamida (PTU em dose alta, que também bloqueia a conversão de T4 em T3), iodo (após 1 h da tionamida), glicocorticoide (hidrocortisona) e tratamento do fator precipitante.", "pegadinha": "Iodo só depois da tionamida (senão alimenta a síntese hormonal); não esperar dosagens hormonais para tratar.", "ref": "Ross DS et al. ATA Guidelines for Hyperthyroidism (Thyroid 2016;26:1343-1421). Burch HB, Wartofsky L. Life-threatening thyrotoxicosis (Endocrinol Metab Clin North Am 1993;22:263-277).", "cards": [["Quais as medidas farmacológicas na crise tireotóxica?", "Betabloqueador ({{c1::propranolol}}), tionamida ({{c1::PTU}} em dose alta), iodo {{c1::após}} a tionamida, glicocorticoide e tratar o precipitante."]], "nota": "", "esperada": "a)Qual é o diagnóstico clínico mais provável para a paciente? O diagnóstico clínico mais provável para a paciente é crise tireotóxica (ou tempestade tireoidiana). Os sinais e sintomas que sustentam esse diagnóstico incluem: •Febre alta (39,5°C): uma característica comum na crise tireotóxica. •Taquicardia (FC 130 bpm): o aumento da frequência cardíaca é um dos principais sinais de hipertireoidismo exacerbado. •Sudorese intensa e tremores: são manifestações típicas da hiperatividade do sistema nervoso simpático em resposta ao excesso de hormônios tireoidianos. •Agitação e ansiedade: estes sintomas neurológicos são frequentes em estados hipermetabólicos. •Exoftalmia: embora não seja um sinal crítico na crise, a presença de exoftalmia sugere a possibilidade de doença de Graves, que é uma causa comum de hipertireoidismo. Esses achados clínicos, em conjunto, indicam que a paciente está em uma situação de emergência endocrinológica. b)Quais são as principais medidas terapêuticas farmacológicas necessárias na abordagem desta paciente ? Medicamentos antitireoidianos: O Propiltiouracil (PTU) é preferido. O PTU não apenas inibe a síntese de hormônios tireoidianos na glândula tireoide, mas também bloqueia a conversão de T4 (tiroxina) em T3 (triiodotironina) na periferia. Alem disso, o PTU tem acao mais rápida em comparação com metimazol. Beta-bloqueadores: Medicamentos como propranolol são usados para controlar sintomas como taquicardia, tremores e ansiedade, além de atuar na redução da conversão de T4 em T3. Corticosteroides: A hidrocortisona pode ser utilizada para tratar a inflamação e prevenir insuficiência adrenal, que pode ocorrer em situações de estresse severo. Soluções intravenosas: Hidratação com fluidos IV é fundamental, principalmente para lidar com a desidratação e manter a perfusão adequada.", "partes": ["a) Diagnóstico: crise tireotóxica", "b) Medida terapêutica 1", "b) Medida terapêutica 2"]}, {"n": 40, "area": "Nefrologia", "tema": "Rabdomiólise: indicação de diálise de urgência", "assunto": "Injúria renal aguda", "macro": "Nefrologia", "raciocinio": "Conduta", "tipo": "aberta", "enunciado": "Paciente, 35 anos, corredor de ultramaratonas. Relata que desde a última prova há 6 horas \"não está se sentindo bem\" e que apresentou \"urina escura\", resolvendo então procurar atendimento médico. Ao exame o paciente encontra-se taquipnéico e com muita dor muscular nos membros inferiores, sem outros achados. Exames complementares demonstram: Hb: 11,5 g/dL; Ht: 36%; VCM: 85 fL; CHCM: 32; Leuco: 9.950/mm³; Nt: 8.000/mm³; Linf: 1.600/mm³; Eo: 250/mm³; Mono: 100/mm³; Plt: 356.000/mm³ Uréia: 82 mg/dL; Creatinina: 8,6 md/dL Na: 156 mEq/L; K: 7,5 mEq/L CPK: 12.000 U/L Gasometria Arterial: pH: 7,05; pCO2: 12; Bicarbonato: 6; pO2: 115; StO2: 100% ECG com onda T apiculada Realizadas as medidas de atendimento iniciais, sem diurese e sem melhora nos exames. Decidido por solicitar parecer para você, o nefrologista do plantão, para decidir sobre a necessidade de diálise de urgência. O paciente apresenta indicação? Justifique", "imagens": [], "conceito": "Após esforço extremo, urina escura, CPK de 12.000 U/L, hipercalemia grave (7,5 mEq/L, ECG com onda T apiculada), acidose (pH de 7,05) e oligúria: lesão renal aguda por rabdomiólise, refratária ao manejo inicial.", "conduta": "Indicações de diálise de urgência: acidose grave, hipercalemia refratária, sobrecarga volêmica, uremia com complicações (pericardite, encefalopatia) e intoxicações dialisáveis. Hidratação intensa e vigilância do potássio antes da diálise.", "pegadinha": "Hipercalemia com alterações de ECG e acidose refratárias indicam hemodiálise sem esperar; a mioglobina não é dialisável com eficiência.", "ref": "Harrison: Medicina Interna, 21ª ed. (2022). KDIGO Clinical Practice Guideline for AKI (Kidney Int Suppl 2012;2:1-138).", "cards": [["Quando indicar diálise de urgência na rabdomiólise?", "Hipercalemia {{c1::refratária}} (com alteração no ECG), acidose {{c1::grave}}, sobrecarga volêmica ou uremia com complicações, mesmo após as medidas iniciais."]], "nota": "", "esperada": "Sim, O paciente apresenta acidose grave e hipercalemia grave e refratária, necessitando de hemodiálise de urgência.", "partes": ["Indicação de diálise: sim", "Justificativa 1: acidose grave", "Justificativa 2: hipercalemia refratária"]}, {"n": 41, "area": "Nefrologia", "tema": "Indicações de biópsia renal", "assunto": "Glomerulopatias e síndromes nefrótica/nefrítica", "macro": "Nefrologia", "raciocinio": "Conduta", "tipo": "match", "enunciado": "Responda se a biópsia renal está indicada ou não, para cada paciente abaixo:", "imagens": [], "conceito": "Biópsia renal: indicada na síndrome nefrótica do adulto, na síndrome nefrítica com queda da função ou dúvida diagnóstica, na IRA sem causa definida e no diabético com quadro atípico (DM de menos de 5 a 10 anos, sem retinopatia, hematúria ou queda rápida da TFG). Não indicada na síndrome nefrótica típica da criança entre 1 e 11 anos, tratada com corticoide.", "conduta": "Criança com síndrome nefrótica típica: prednisona sem biópsia; biópsia se corticorresistência, hematúria, hipertensão, queda de TFG ou idade fora da faixa.", "pegadinha": "A síndrome nefrótica do adulto sempre pede biópsia; na criança típica, não. O diabético com poucos anos de doença e sem retinopatia tem nefropatia atípica.", "ref": "KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases (Kidney Int 2021;100(4S):S1-S276).", "cards": [["Quando indicar biópsia renal na síndrome nefrótica?", "Em {{c1::adultos}} sempre; na criança de 1 a 11 anos com quadro típico, {{c1::não}} (prednisona primeiro). No diabético com doença {{c1::recente}}, sem retinopatia, também."]], "nota": "", "esperada": "Paciente sexo masculino, 21 anos (hematúria macroscópica e Cr 1,8): Biópsia Renal Indicada Paciente sexo feminino, 34 anos (proteinúria 12,9 g/24 h): Biópsia Renal Indicada Paciente sexo masculino, 48 anos (diabetes há 3 anos, proteinúria 3,37 g/24 h): Biópsia Renal Indicada Paciente sexo masculino, 11 anos (síndrome nefrótica): Biópsia Renal Não Indicada", "escolhas": ["Biópsia indicada", "Biópsia não indicada"], "itens": [{"t": "Homem de 21 anos, hematúria macroscópica e edema, Cr 1,8, proteinúria 1500 mg/24 h, C3 e C4 normais, episódio prévio semelhante.", "c": "Biópsia indicada"}, {"t": "Mulher de 34 anos, edema até a raiz da coxa, albumina 1,7, proteinúria 12,9 g/24 h, hematúria microscópica.", "c": "Biópsia indicada"}, {"t": "Homem de 48 anos, diabetes há 3 anos, edema, proteinúria 3,37 g/24 h, fundo de olho normal, creatinina 0,37.", "c": "Biópsia indicada"}, {"t": "Menino de 11 anos, edema periorbitário, proteinúria 8500 mg/24 h, albumina 1,4, sem hematúria.", "c": "Biópsia não indicada"}]}, {"n": 42, "area": "Endocrinologia", "tema": "Insuficiência adrenal primária × secundária", "assunto": "Adrenal e feocromocitoma", "macro": "Endocrinologia", "raciocinio": "Fisiopatologia", "tipo": "match", "enunciado": "Identifique em qual tipo de insuficiência adrenal são encontrados os achados clínicos e laboratoriais abaixo:", "imagens": [], "conceito": "IA primária (Addison): destruição do córtex; ACTH alto, hiperpigmentação, hipercalemia e hiponatremia, aldosterona baixa, vitiligo por autoimunidade. IA secundária: déficit de ACTH; sem hiperpigmentação, aldosterona normal (eixo renina- angiotensina íntegro) e potássio normal.", "conduta": "Cortisol matinal e ACTH; teste da cosintropina se duvidoso; primária: hidrocortisona e fludrocortisona; secundária: só glicocorticoide.", "pegadinha": "O gabarito oficial diz 'Hipocalemia → Primária', mas na IA primária o esperado é hipercalemia, por falta de aldosterona; pode ser erro de digitação da prova. Fique com: ACTH alto, hiperpigmentação, vitiligo e hipercalemia = primária; aldosterona normal = secundária.", "ref": "Bornstein SR et al. Primary Adrenal Insufficiency: Endocrine Society Guideline (J Clin Endocrinol Metab 2016;101:364-389).", "cards": [["Compare a insuficiência adrenal primária e a secundária.", "Primária: ACTH {{c1::alto}}, {{c1::hiperpigmentação}}, vitiligo, hipercalemia, aldosterona baixa. Secundária: ACTH baixo, sem hiperpigmentação, aldosterona {{c1::normal}}."]], "nota": "O gabarito do professor lista hipocalemia como achado da forma primária, o que parece erro (na primária há hipercalemia). Siga o gabarito da prova aqui.", "esperada": "Hipocalemia → Primária Vitiligo → Primária Níveis de Aldosterona normais → Secundária Aumento do ACTH → Primária Hiperpigmentação da pele e mucosas → Primária", "escolhas": ["Insuficiência adrenal primária", "Insuficiência adrenal secundária"], "itens": [{"t": "Hipocalemia", "c": "Insuficiência adrenal primária"}, {"t": "Vitiligo", "c": "Insuficiência adrenal primária"}, {"t": "Níveis de aldosterona normais", "c": "Insuficiência adrenal secundária"}, {"t": "Aumento do ACTH", "c": "Insuficiência adrenal primária"}, {"t": "Hiperpigmentação da pele e mucosas", "c": "Insuficiência adrenal primária"}]}, {"n": 43, "area": "Endocrinologia", "tema": "Bócio multinodular tóxico", "assunto": "Tireoide: função e tireoidites", "macro": "Endocrinologia", "raciocinio": "Diagnóstico", "tipo": "mcq", "enunciado": "Mulher de 73 anos apresenta-se à consulta com queixas de palpitações, perda de peso não intencional e aumento do apetite. Relata ainda sensação de calor excessivo e sudorese aumentada. A paciente menciona que esses sintomas começaram de forma insidiosa há cerca de seis meses e têm piorado progressivamente.\nExame físico: taquicardia e tremores finos nas mãos. TSH suprimido. Cintilografia da tireoide com captação de I-123: múltiplos nódulos hipercaptantes (“quentes”) e áreas de tecido tireoidiano não funcionante (“frios”). Qual é o diagnóstico mais provável para esta paciente?", "imagens": [], "conceito": "Idosa com tireotoxicose e cintilografia com múltiplos nódulos hipercaptantes e áreas hipocaptantes: bócio multinodular tóxico (doença de Plummer). Comum em idosos, por nódulos autônomos independentes do TSH.", "conduta": "Tionamida para controle inicial; tratamento definitivo com radioiodo ou cirurgia (a tireoidectomia se há compressão ou nódulo suspeito). Tionamida a longo prazo é opção em idosos frágeis.", "pegadinha": "Graves tem captação difusa e homogênea; bócio uninodular tóxico tem um único foco quente com supressão do restante; Hashimoto não causa captação aumentada.", "ref": "Ross DS et al. ATA Guidelines for Hyperthyroidism (Thyroid 2016;26:1343-1421).", "cards": [["Qual a cintilografia do bócio multinodular tóxico e o tratamento definitivo?", "Múltiplos nódulos {{c1::hipercaptantes}} e áreas frias; tratar com {{c1::radioiodo}} ou cirurgia (tionamida para controle inicial)."]], "nota": "", "opcoes": [{"l": "A", "t": "Bocio uninodular tóxico"}, {"l": "B", "t": "Doença de Graves"}, {"l": "C", "t": "Bócio multinodular tóxico"}, {"l": "D", "t": "Tireoidite de Hashimoto"}], "certas": ["C"], "comentarios": {"A": "Incorreta. Uninodular tóxico mostra um único nódulo hipercaptante.", "B": "Incorreta. Graves mostra captação difusa e homogênea.", "C": "Correta. Vários nódulos hipercaptantes e áreas frias.", "D": "Incorreta. Hashimoto cursa com hipotireoidismo ou tireotoxicose transitória, com captação baixa."}, "feedback": "O bócio multinodular tóxico é uma causa comum de hipertireoidismo em pacientes idosos. Caracteriza-se pela presença de múltiplos nódulos na tireoide que funcionam de forma autônoma, independentemente do TSH. Esses nódulos produzem hormônios tireoidianos em excesso, levando aos sintomas de hipertireoidismo. O tratamento pode incluir medicamentos antitireoidianos, iodo radioativo ou cirurgia, dependendo da gravidade dos  séricos e iniciar levotiroxina sem demora Sem tratamento precoce: déficit neurocognitivo permanente Levotiroxina IV + hidrocortisona IV sem aguardar exames (risco de crise adrenal) Suporte ventilatório, aquecimento passivo, tratar infecção e outros precipitantes O coma nem sempre existe: confusão mental já basta para suspeitar Endocrinologia (2 de 4): Tireotoxicose, doença de Graves e crise tireotóxica TC2 2024.2 · página 3 Conceito e definição Abordagem diagnóstica Causas e diferenciais Achados e exames Tratamento e conduta Alertas, complicações e emergências Questões desta prova ligadas a este mapa: Q33, Q39, Q43, Q44 Material de estudo elaborado a partir das questões da prova e das referências citadas nos gabaritos (KDIGO, ATA, Endocrine Society, Robbins, Harrison, Vilar). Confirme condutas e doses nas fontes. TIREOTOXICOSE TSH suprimido, T4L e T3 elevados calor, sudorese, palpitações, perda de peso, tremor Captação de iodo ALTA ou normal a tireoide produz em excesso Captação BAIXA liberação ou fonte externa Subclínico TSH baixo, T4L e T3 normais repetir em 3 a 6 meses Doença de Graves captação difusa · TRAb · bócio difuso orbitopatia · dermopatia Bócio multinodular tóxico idosos · nódulos quentes e frios Nódulo tóxico um foco quente, resto suprimido Tireoidites: subaguda, silenciosa, pós-parto fase tireotóxica autolimitada Exógena (factícia): tireoglobulina BAIXA amiodarona, struma ovarii Bócio + orbitopatia + tireotoxicose: diagnóstico sem TRAb nem cintilografia Histologia: hiperplasia difusa, células altas colunares, papilas · anticorpo estimulador do TSH Tratamento: metimazol 12 a 18 meses, radioiodo ou cirurgia Tionamida para controlar, depois radioiodo ou cirurgia (não remite) Sem tionamida: betabloqueador corticoide na subaguda dolorosa Suspender a fonte do hormônio Tratamento geral Betabloqueador para sintomas (propranolol) Metimazol: 1ª escolha PTU: 1º trimestre e crise tireotóxica Seguimento: T4L e T3 a cada 4 a 6 semanas TSH demora a normalizar Efeitos adversos: agranulocitose (febre e dor de garganta), hepatotoxicidade (PTU) Tratar se idoso com fibrilação atrial, osteoporose ou TSH persistente abaixo de 0,1 CRISE TIREOTÓXICA febre alta, taquicardia, agitação, disfunção de órgãos precipitante: infecção, cirurgia, suspensão da droga Betabloqueador + tionamida (PTU em dose alta) Iodo após 1 hora da tionamida Hidrocortisona + hidratação + suporte em UTI Tratar o fator precipitante diagnóstico clínico (Burch-Wartofsky) Endocrinologia (3 de 4): Nódulo de tireoide: TI-RADS, PAAF, Bethesda e carcinomas TC2 2024.2 · página 4 Conceito e definição Abordagem diagnóstica Causas e diferenciais Achados e exames Tratamento e conduta Alertas, complicações e emergências Questões desta prova ligadas a este mapa: Q03, Q17 Material de estudo elaborado a partir das questões da prova e das referências citadas nos gabaritos (KDIGO, ATA, Endocrine Society, Robbins, Harrison, Vilar). Confirme condutas e doses nas fontes. NÓDULO DE TIREOIDE palpável ou achado de imagem Dosar TSH TSH suprimido: cintilografia (nódulo quente = tóxico) TSH normal ou alto: ultrassonografia TI-RADS: composição, ecogenicidade, forma, margem e focos ecogênicos TR1 e TR2: sem PAAF TR3: PAAF se 2,5 cm ou mais TR4: PAAF se 1,5 cm ou mais TR5: PAAF se 1,0 cm ou mais PAAF: Bethesda I: não diagnóstica, repetir II: benigna, seguimento III e IV: atipia ou neoplasia folicular repetir, molecular ou lobectomia V e VI: suspeito ou maligno cirurgia Carcinomas Papilífero (mais comum) núcleos em vidro fosco, sulcos, pseudoinclusões · nem sempre há papilas disseminação linfática · ótimo prognóstico Folicular invasão da cápsula ou de vasos disseminação hematogênica PAAF não distingue adenoma Medular células C, calcitonina, amiloide NEM 2 e mutação de RET Anaplásico idoso, agressivo, pior prognóstico Tireoidectomia ± radioiodo supressão de TSH · tireoglobulina no seguimento Sem radioiodo: calcitonina e CEA antes da cirurgia excluir feocromocitoma e hiperparatireoidismo Cirurgia raramente possível tratamento multimodal e paliativo Endocrinologia (4 de 4): Adrenal: insuficiência, crise, incidentaloma, feocromocitoma e Cushing TC2 2024.2 · página 5 Conceito e definição Abordagem diagnóstica Causas e diferenciais Achados e exames Tratamento e conduta Alertas, complicações e emergências Questões desta prova ligadas a este mapa: Q01, Q06, Q31, Q38, Q42 Material de estudo elaborado a partir das questões da prova e das referências citadas nos gabaritos (KDIGO, ATA, Endocrine Society, Robbins, Harrison, Vilar). Confirme condutas e doses nas fontes. INSUFICIÊNCIA ADRENAL astenia, perda de peso, hipotensão, dor abdominal Primária (Addison) ACTH ALTO · hiperpigmentação hiponatremia e HIPERcalemia · aldosterona baixa autoimune (anti-21-hidroxilase) · vitiligo Secundária ACTH BAIXO · sem hiperpigmentação potássio e aldosterona normais tumor hipofisário, suspensão de corticoide Diagnóstico: cortisol matinal e ACTH teste da cosintropina se duvidoso CRISE ADRENAL hipotensão, choque, vômitos, dor abdominal precipitantes: infecção, cirurgia, suspensão do corticoide Não esperar exames: soro fisiológico + hidrocortisona 100 mg IV depois 50 mg de 6 em 6 horas Manutenção: hidrocortisona ou prednisona + fludrocortisona (só na primária) Apenas glicocorticoide Educação: dose de estresse em doenças, cirurgias, acidentes · carta e cartão de emergência INCIDENTALOMA massa adrenal achada ao acaso Densidade sem contraste: 10 UH ou menos = adenoma Acima de 10 UH: washout absoluto 60% ou mais · relativo 40% ou mais = adenoma Sempre avaliar função: dexametasona 1 mg, metanefrinas, aldosterona e renina se hipertenso FEOCROMOCITOMA tumor de células cromafins da medula Regra dos 10: extra-adrenal (paragangliomas), bilateral, maligno, familiar (NEM 2, VHL, NF1) Hipertensão paroxística, cefaleia, sudorese, palpitações, palidez pode simular síndrome consumptiva Diagnóstico: metanefrinas plasmáticas ou urinárias depois TC ou RM ALFA-bloqueio primeiro, depois beta-bloqueio e cirurgia SÍNDROME DE CUSHING Rastreio: cortisol livre urinário, cortisol salivar noturno ou supressão com dexametasona 1 mg Eixo gonadal: hipogonadismo por inibição de LH e FSH, irregularidade menstrual Depois: ACTH para localizar hipofisário, ectópico ou adrenal Nefrologia (1 de 4): Doença renal crônica: estadiamento, complicações, tratamento e diálise TC2 2024.2 · página 6 Conceito e definição Abordagem diagnóstica Causas e diferenciais Achados e exames Tratamento e conduta Alertas, complicações e emergências Questões desta prova ligadas a este mapa: Q02, Q04, Q07, Q13, Q22, Q25 Material de estudo elaborado a partir das questões da prova e das referências citadas nos gabaritos (KDIGO, ATA, Endocrine Society, Robbins, Harrison, Vilar). Confirme condutas e doses nas fontes. DRC TFG abaixo de 60 ou marcador de lesão renal por mais de 3 meses Rastreio e diagnóstico Creatinina com TFGe (cistatina C se a creatinina for imprecisa) Albuminúria: relação albumina/creatinina repetir: infecção e exercício elevam US: rins reduzidos, córtex hiperecogênico, perda da diferenciação corticomedular (rins grandes: diabetes, amiloide, policístico) Estadiamento KDIGO G1 90 ou mais · G2 60 a 89 · G3a 45 a 59 G3b 30 a 44 · G4 15 a 29 · G5 abaixo de 15 A1 abaixo de 30 · A2 30 a 300 · A3 acima de 300 mg/g Mapa de risco: quanto mais G e A, maior o risco (G1A3 já é alto) Complicações e monitorização Anemia: hemoglobina e cinética do ferro Distúrbio mineral e ósseo: cálcio, fósforo, PTH, 25-OH vitamina D Hipercalemia: potássio Acidose: bicarbonato ou gasometria Hipervolemia e hipertensão: pressão e edema Uremia: sintomas Tratamento IECA ou BRA se albuminúria queda de TFG de até 30% é aceitável iSGLT2 (TFGe 20 ou mais) · finerenona no DM2 com albuminúria Meta de PAS abaixo de 120 se tolerada estatina · evitar nefrotóxicos Diabetes: metformina ajustada à TFG, iSGLT2 e GLP-1 (não iDPP4) Encaminhar ao nefrologista: risco muito alto, queda rápida, G4 e G5 Terapia renal substitutiva G5: preparar acesso e /* ---------- utilidades ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

/* ---------- correção automática ---------- */
function blank(q) {
  const t = q.tipo;
  if (t === 'multi') return [];
  if (t === 'match') return q.itens.map(() => '');
  if (t === 'lacunas') return q.lacunas.map(() => '');
  if (t === 'aberta') return '';
  return '';
}
function ansOf(a, n) {
  if (!a.ans[n]) { const q = BYN[n]; a.ans[n] = {resp: blank(q), conf: '', t: 0, marc: false, nota: null, partes: null, graded: false, causa: '', revealed: false}; }
  return a.ans[n];
}
function answered(q, r) {
  if (q.tipo === 'mcq') return !!r.resp;
  if (q.tipo === 'multi') return r.resp.length > 0;
  if (q.tipo === 'match' || q.tipo === 'lacunas') return r.resp.some(x => String(x).trim());
  return String(r.resp).trim().length > 0;
}
function nota(q, r) { // retorna 0..1 ou null se pendente
  if (q.tipo === 'mcq') return q.certas.includes(r.resp) ? 1 : 0;
  if (q.tipo === 'multi') {
    const ok = r.resp.filter(x => q.certas.includes(x)).length, ruim = r.resp.length - ok;
    return Math.max(0, ok - ruim) / q.certas.length;
  }
  if (q.tipo === 'match') return q.itens.filter((it, i) => r.resp[i] === it.c).length / q.itens.length;
  if (!r.graded) return null;
  const p = r.partes || [];
  const total = q.tipo === 'lacunas' ? q.lacunas.length : q.partes.length;
  return p.filter(Boolean).length / total;
}
function respTexto(q, r) {
  if (q.tipo === 'mcq') return r.resp || '(em branco)';
  if (q.tipo === 'multi') return r.resp.length ? r.resp.slice().sort().join(', ') : '(em branco)';
  if (q.tipo === 'match') return q.itens.map((it, i) => (i + 1) + ') ' + (r.resp[i] || '-')).join(' | ');
  if (q.tipo === 'lacunas') return r.resp.map((x, i) => (i + 1) + ') ' + (String(x).trim() || '-')).join(' | ');
  return String(r.resp).trim() || '(em branco)';
}
function gabTexto(q) {
  if (q.tipo === 'mcq' || q.tipo === 'multi') return q.certas.join(', ');
  if (q.tipo === 'match') return q.itens.map((it, i) => (i + 1) + ') ' + it.c).join(' | ');
  if (q.tipo === 'lacunas') return q.lacunas.map((x, i) => (i + 1) + ') ' + x).join(' | ');
  return q.esperada;
}
const FORMATO = {mcq: 'Múltipla escolha', multi: 'Múltipla seleção', match: 'Associação', lacunas: 'Lacunas', aberta: 'Discursiva'};
function recompute(a) { // atualiza nota em todas as respostas
  a.ids.forEach(n => { const r = ansOf(a, n); r.nota = nota(BYN[n], r); });
}

/* ---------- ações globais ---------- */
function novaTentativa(ids, opts) {
  opts = opts || {};
  if (opts.shuffle) ids = ids.slice().sort(() => Math.random() - .5);
  const a = {id: 'a' + Date.now(), ts: Date.now(), ids, modo: opts.modo || 'prova', retest: !!opts.retest, base: opts.base || null,
    fase: 'prova', fim: null, pos: 0, elapsed: 0, ans: {}};
  ids.forEach(n => ansOf(a, n));
  S.attempts.push(a); S.cur = a.id; save(); VIEW = 'prova'; render(); window.scrollTo(0, 0);
}
function ir(v, id) { if (id) S.cur = id; VIEW = v; save(); render(); window.scrollTo(0, 0); }
function delAtt(id) {
  if (!confirm('Apagar esta tentativa?')) return;
  S.attempts = S.attempts.filter(a => a.id !== id); if (S.cur === id) S.cur = null; save(); render();
}

/* ---------- timer ---------- */
setInterval(() => {
  const a = att();
  if (VIEW !== 'prova' || !a || a.fase !== 'prova' || document.visibilityState !== 'visible') return;
  a.elapsed++; const n = a.ids[a.pos]; ansOf(a, n).t++;
  const el = $('tmr'); if (el) el.textContent = fmtT(a.elapsed);
  if (a.elapsed % 5 === 0) save();
}, 1000);

}

function iniciar(modo) {
  const m = document.querySelector('input[name=modo]:checked').value, shuffle = $('shuf').checked;
  let ids = Q.map(q => q.n);
  if (modo === 'sel') {
    const sel = [...document.querySelectorAll('.subj:checked')].map(x => x.value);
    if (!sel.length) { alert('Marque pelo menos um assunto.'); return; }
    ids = Q.filter(q => sel.includes(q.assunto)).map(q => q.n);
  }
  novaTentativa(ids, {modo: m, shuffle});
}
function iniciarReteste(id) {
  const a = S.attempts.find(x => x.id === id);
  const ids = a.ids.filter(n => (a.ans[n].nota || 0) < 1);
  novaTentativa(ids, {modo: 'prova', retest: true, base: id});
}
function backup() { baixar('backup_simulado_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(S), 'application/json'); }
function restaurar(inp) {

  h += `<h2>Segurança versus resultado</h2><div class="card"><div class="matrix">
   <div class="h"></div><div class="h">Acertou</div><div class="h">Errou ou parcial</div>
   <div class="h">Tinha certeza</div><div><b>${cm.certeza[0]}</b> domínio real</div><div><b>${cm.certeza[1]}</b> ponto cego: o mais perigoso</div>
   <div class="h">Em dúvida</div><div><b>${cm.duvida[0]}</b> acertou na dúvida</div><div><b>${cm.duvida[1]}</b> lacuna conhecida</div>
   <div class="h">Chutou</div><div><b>${cm.chute[0]}</b> sorte: não conta como aprendido</div><div><b>${cm.chute[1]}</b> lacuna conhecida</div>
   ${cm[''][0] + cm[''][1] ? `<div class="h">Não informou</div><div><b>${cm[''][0]}</b></div><div><b>${cm[''][1]}</b></div>` : ''}</div>
   ${cego.length ? `<div class="box bad"><b class="t">Pontos cegos (errou com certeza)</b>Questões ${cego.map(x => x.n).join(', ')}. Você acredita saber e está errado, por isso revise estas primeiro.</div>` : ''}
   ${sorte.length ? `<div class="box warn"><b class="t">Acertos no chute</b>Questões ${sorte.map(x => x.n).join(', ')}. Entram no plano como se fossem erros.</div>` : ''}</div>`;

  // causas
  h += `<h2>Por que você errou</h2><div class="card">`;
  const ck = Object.keys(causaTotal).sort((x, y) => causaTotal[y] - causaTotal[x]);
  h += ck.length ? ck.map(k => `<div class="barrow"><div>${esc(CAUSA_TXT[k])}</div><div class="bar"><i class="a" style="width:${pct(causaTotal[k], nc)}%"></i></div><div class="small"><b>${causaTotal[k]}</b> de ${nc}</div></div>`).join('') : '<p class="mut">Nenhuma causa marcada ainda.</p>';
  h += `</div>`;

  // tempo
  const lentos = respostas.filter(x => x.r.t > Math.max(90, med * 2)).sort((x, y) => y.r.t - x.r.t).slice(0, 6);
  h += `<h2>Tempo</h2><div class="card"><p>Média ${fmtT(respostas.reduce((s, x) => s + x.r.t, 0) / N)} por questão; mediana ${fmtT(med)}.</p>
   ${lentos.length ? `<p><b>Questões que mais consumiram tempo:</b></p><ul>${lentos.map(x => `<li>Q${x.n} (${esc(x.q.assunto)}): ${fmtT(x.r.t)} · ${x.r.nota >= 1 ? 'acertou' : 'errou ou parcial'}</li>`).join('')}</ul>${lentos.filter(x => x.r.nota < 1).length ? '<p class="small mut">As que gastaram tempo e ainda assim erraram são candidatas a "pular e voltar no fim".</p>' : ''}` : '<p class="mut">Nenhuma questão fugiu muito do seu ritmo.</p>'}</div>`;

  // plano
  const pr = plano(a);
  const dts = datas();
  h += `<h2>Conduta: o que estudar agora</h2>`;
  if (!pr.length) h += `<div class="box ok">Nenhum assunto ficou com perda relevante. Faça um reteste em D+7 para confirmar.</div>`;
  pr.forEach((o, i) => {
    const macro = BYN[o.ns[0] || a.ids.find(n => BYN[n].assunto === o.k)].macro;
    const c = causasDe(a, o.ns), dom = Object.keys(c).sort((x, y) => c[y] - c[x])[0];
    const rec = RECURSOS[macro];
    h += `<div class="card"><h3 style="margin-top:0">${i + 1}. ${esc(o.k)} <span class="pill">${o.pts.toFixed(1)} de ${o.n}</span></h3>
     <p class="small mut">Prioridade calculada por pontos perdidos, mais meio ponto por acerto no chute e um ponto por erro com certeza.</p>
     <ul>
      <li><b>Rever estas questões:</b> ${o.ns.concat(o.sorte).filter((v, j, ar) => ar.indexOf(v) === j).sort((x, y) => x - y).map(n => `Q${n} (${esc(BYN[n].tema)})`).join('; ') || 'nenhuma'}.</li>
      ${o.pontoCego.length ? `<li><b>Pontos cegos:</b> Q${o.pontoCego.join(', Q')}. Começar por elas.</li>` : ''}
      ${dom ? `<li><b>Causa mais comum aqui:</b> ${esc(CAUSA_TXT[dom])}. ${esc(acaoCausa(dom))}</li>` : ''}
      <li><b>Material:</b> ${esc(rec[0])} e ${esc(rec[1])}.</li>
      <li><b>Cartões dos seus erros:</b> use o botão abaixo para baixar o CSV e importar no Anki.</li>
     </ul></div>`;
  });
  // diagnósticos globais
  const dx = [];
  const abertas = respostas.filter(x => x.q.tipo === 'aberta' || x.q.tipo === 'lacunas'), objet = respostas.filter(x => !(x.q.tipo === 'aberta' || x.q.tipo === 'lacunas'));
  const sa = abertas.reduce((s, x) => s + (x.r.nota || 0), 0), so = objet.reduce((s, x) => s + (x.r.nota || 0), 0);
  if (abertas.length >= 3 && objet.length >= 3 && pct(sa, abertas.length) + 15 < pct(so, objet.length)) dx.push(`Você vai pior nas discursivas e lacunas (${pct(sa, abertas.length)}%) do que nas objetivas (${pct(so, objet.length)}%). Treine escrever a resposta de memória, em duas linhas: nome do diagnóstico ou da conduta e o motivo.`);
  if (causaTotal.leitura >= 2 || (nc && (causaTotal.leitura || 0) / nc >= 0.25)) dx.push('Boa parte dos erros veio de leitura. Antes de ler as alternativas, sublinhe o que a pergunta pede.');
  if (cego.length >= 3) dx.push(`Você errou ${cego.length} questões com certeza. Em prova, essas são as que mais custam, porque você nem desconfia. Revise-as antes de qualquer outra coisa.`);
  const sk = grupos(a, q => q.raciocinio).filter(o => o.n >= 4)[0];
  if (sk && pct(sk.pts, sk.n) < 60) dx.push(`O tipo de questão em que você mais perde é "${sk.k}" (${pct(sk.pts, sk.n)}% de ${sk.n}). Priorize treinar esse tipo de raciocínio, não só o assunto.`);
  if (dx.length) h += `<h3>Padrões gerais</h3>` + dx.map(t => `<div class="box info">${esc(t)}</div>`).join('');
  h += `<h3>Calendário de revisão sugerido</h3><div class="card"><div class="row">${dts.map(d => `<span class="pill pri">${d[0]}: ${d[1]}</span>`).join('')}</div>
   <p class="small mut">D+1: cartões dos erros no Anki. D+3: refazer só os erros (botão abaixo). D+7: reler as pegadinhas. D+14: novo simulado completo ou de outra prova, para ver se o ganho se manteve.</p></div>`;

  const nCards = cardsDe(a).length;
  h += `<h2>Ações</h2><div class="row noprint">
   <button class="pri" onclick="exportCards()">Baixar cartões Anki dos meus erros (${nCards})</button>
   <button onclick="exportTabela()">Baixar tabela completa (CSV)</button>
   <button onclick="copiarRelatorio()">Copiar relatório para colar no Claude</button>
   <button onclick="iniciarReteste('${a.id}')" ${erros.length ? '' : 'disabled'}>Refazer só os erros (${erros.length})</button>
   <button onclick="window.print()">Imprimir / salvar PDF</button>
   <button onclick="ir('correcao')">Voltar à correção</button><button onclick="ir('acumulado')">Painel acumulado</button><button onclick="ir('home')">Início</button></div>
   <p id="msg" class="small mut" role="status"></p>`;

  // tabela
  h += `<h2>Tabela das respostas</h2><div class="tw"><table><tr><th>Q</th><th>Assunto</th><th>Raciocínio</th><th>Formato</th><th>Sua resposta</th><th>Gabarito</th><th>Nota</th><th>Segurança</th><th>Tempo</th><th>Causa</th></tr>` +
   respostas.map(x => { const r = x.r, q = x.q, cf = CONF.find(c => c[0] === r.conf);
     return `<tr><td>${x.n}</td><td>${esc(q.assunto)}</td><td>${esc(q.raciocinio)}</td><td>${esc(FORMATO[q.tipo])}</td><td>${esc(respTexto(q, r).slice(0, (q.tipo === 'aberta' ? 60 : 120)))}</td><td>${esc((q.tipo === 'aberta' ? '(discursiva)' : gabTexto(q)).slice(0, 120))}</td>
     <td class="${r.nota >= 1 ? 'tag-ok' : r.nota > 0 ? 'tag-par' : 'tag-err'}">${(r.nota == null ? 0 : r.nota).toFixed(2)}</td><td>${cf ? cf[1] : '-'}</td><td>${fmtT(r.t)}</td><td>${esc(CAUSA_TXT[r.causa] || '')}</td></tr>`; }).join('') + `</table></div>`;
  return h;
}
function cardsDe(a) {
  const lista = [];
  a.ids.forEach(n => { const r = a.ans[n]; if (r.nota < 1 || r.conf === 'chute') BYN[n].cards.forEach(c => lista.push({n, c})); });
  return lista;
}
function csvCel(s) { return '"' + String(s).replace(/"/g, '""') + '"'; }
function exportCards() {
  const a = att(), l = cardsDe(a);
  if (!l.length) { alert('Sem erros para virar cartão.'); return; }
  const linhas = ['Nº;Cartão (pergunta, Enter e resposta);Fonte'];
  l.forEach((x, i) => linhas.push([i + 1, csvCel(x.c[0] + '\n' + x.c[1]), csvCel(D.prova + ' Q.' + String(x.n).padStart(2, '0'))].join(';')));
  baixar('TC2_' + D.prova.split(' ')[1] + '_cartoes_dos_meus_erros.csv', linhas.join('\r\n'), 'text/csv', true);
  msg('CSV de cartões baixado. No Anki, importe com separador ponto e vírgula e o modelo Cloze.');
}
function msg(t) { const e = $('msg'); if (e) e.textContent = t; }
function exportTabela() {
  const a = att(), cab = ['tentativa', 'questao', 'area', 'assunto', 'raciocinio', 'formato', 'tema', 'sua_resposta', 'gabarito', 'nota', 'seguranca', 'tempo_s', 'causa_do_erro'];
  const l = [cab.join(';')];
  a.ids.forEach(n => { const q = BYN[n], r = a.ans[n];
    l.push([fmtD(a.ts), n, q.macro, q.assunto, q.raciocinio, FORMATO[q.tipo], q.tema, respTexto(q, r), q.tipo === 'aberta' ? '(discursiva)' : gabTexto(q), (r.nota || 0).toFixed(2).replace('.', ','), r.conf || '', r.t, CAUSA_TXT[r.causa] || ''].map(csvCel).join(';')); });
  baixar('TC2_' + D.prova.split(' ')[1] + '_tabela_respostas.csv', l.join('\r\n'), 'text/csv', true);
  msg('Tabela baixada. Abre direto no Excel.');
}
function copiarRelatorio() {
  const a = att(), sc = placar(a);
  const g = (fn) => grupos(a, fn).map(o => `${o.k}: ${o.pts.toFixed(1)}/${o.n}`).join('; ');
  let t = `RELATÓRIO SIMULADO ${D.prova} (${fmtD(a.ts)}), ${a.ids.length} questões, nota ${sc.pts.toFixed(1)}/${sc.max}, tempo ${fmtT(a.elapsed)}\n`;
  t += `Por assunto: ${g(q => q.assunto)}\nPor raciocínio: ${g(q => q.raciocinio)}\nPor formato: ${g(q => FORMATO[q.tipo])}\n\n`;
  t += 'q | assunto | formato | nota | segurança | tempo_s | causa | tema\n';
  a.ids.forEach(n => { const q = BYN[n], r = a.ans[n]; t += [n, q.assunto, FORMATO[q.tipo], (r.nota || 0).toFixed(2), r.conf || '-', r.t, CAUSA_TXT[r.causa] || '-', q.tema].join(' | ') + '\n'; });
  const fim = () => msg('Relatório copiado. Cole na conversa com o Claude para uma análise mais profunda.');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(fim, () => fallbackCopy(t, fim)); else fallbackCopy(t, fim);
}
function fallbackCopy(t, ok) { const x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); try { document.execCommand('copy'); ok(); } catch (e) { msg('Não consegui copiar. Use a tabela em CSV.'); } x.remove(); }

/* ----- painel acumulado ----- */
function vAcumulado() {
  const fin = S.attempts.filter(a => a.fase === 'analise');
  let h = `<h1>Painel acumulado</h1><div class="row noprint"><button onclick="ir('home')">Início</button></div>`;
  if (!fin.length) return h + '<p class="mut">Conclua uma análise para ver o painel.</p>';
  h += `<h2>Evolução</h2><div class="tw"><table><tr><th>Data</th><th>Tipo</th><th>Questões</th><th>Nota</th></tr>${fin.map(a => { const s = placar(a); return `<tr><td>${fmtD(a.ts)}</td><td>${a.retest ? 'Reteste' : 'Prova'}</td><td>${a.ids.length}</td><td>${s.pts.toFixed(1)}/${s.max} (${pct(s.pts, s.max)}%)</td></tr>`; }).join('')}</table></div>`;
  const por = {};
  fin.forEach(a => a.ids.forEach(n => { const r = a.ans[n]; (por[n] = por[n] || []).push(r.nota || 0); }));
  const ns = Object.keys(por).map(Number);
  const reinc = ns.filter(n => por[n].filter(x => x < 1).length >= 2).sort((x, y) => x - y);
  const recup = ns.filter(n => por[n].length >= 2 && por[n][0] < 1 && por[n][por[n].length - 1] >= 1);
  const persiste = ns.filter(n => por[n].length >= 2 && por[n][por[n].length - 1] < 1);
  h += `<h2>Questões</h2><div class="card"><p><b>Erradas em duas ou mais tentativas:</b> ${reinc.length ? reinc.map(n => `Q${n} (${esc(BYN[n].tema)})`).join('; ') : 'nenhuma ainda'}</p>
   <p><b>Recuperadas (errou antes, acertou na última):</b> ${recup.length ? recup.map(n => 'Q' + n).join(', ') : 'nenhuma ainda'}</p>
   <p><b>Ainda erradas na última tentativa:</b> ${persiste.length ? persiste.map(n => 'Q' + n).join(', ') : 'nenhuma'}</p></div>`;
  const sub = {};
  fin.forEach((a, i) => a.ids.forEach(n => { const k = BYN[n].assunto; sub[k] = sub[k] || fin.map(() => [0, 0]); sub[k][i][0] += a.ans[n].nota || 0; sub[k][i][1]++; }));
  h += `<h2>Assunto por tentativa</h2><div class="tw"><table><tr><th>Assunto</th>${fin.map((a, i) => `<th>#${i + 1}</th>`).join('')}</tr>${Object.keys(sub).map(k => `<tr><td>${esc(k)}</td>${sub[k].map(v => `<td>${v[1] ? pct(v[0], v[1]) + '% (' + v[1] + ')' : '-'}</td>`).join('')}</tr>`).join('')}</table></div>`;
  return h;
}
render();
</script>
