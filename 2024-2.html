<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulado TC2 e Análise de Erros</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1b2430; --mut:#5b6675; --line:#dde2e9;
  --pri:#0f6e78; --pri-ink:#ffffff; --pri-soft:#e1f1f2;
  --ok:#1a7f4b; --ok-soft:#e3f4ea; --bad:#b3261e; --bad-soft:#fbe9e7;
  --warn:#8a5a00; --warn-soft:#fff3d6; --info-soft:#eaf0fb;
  --bar:#0f6e78;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161b; --card:#1b2129; --ink:#e8ecf1; --mut:#9aa6b4; --line:#2e3742;
    --pri:#4cc0cb; --pri-ink:#06262a; --pri-soft:#173c40;
    --ok:#5fd093; --ok-soft:#163626; --bad:#ff8a80; --bad-soft:#40201d;
    --warn:#f2c35b; --warn-soft:#3b2f10; --info-soft:#1c2a40; --bar:#4cc0cb;
  }
}
:root[data-theme="dark"]{
    --bg:#12161b; --card:#1b2129; --ink:#e8ecf1; --mut:#9aa6b4; --line:#2e3742;
    --pri:#4cc0cb; --pri-ink:#06262a; --pri-soft:#173c40;
    --ok:#5fd093; --ok-soft:#163626; --bad:#ff8a80; --bad-soft:#40201d;
    --warn:#f2c35b; --warn-soft:#3b2f10; --info-soft:#1c2a40; --bar:#4cc0cb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}
h2{font-size:1.2rem;margin:1.4em 0 .5em}
h3{font-size:1.05rem;margin:1em 0 .4em}
.mut{color:var(--mut)}
.small{font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:9px;min-height:42px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
button.danger{color:var(--bad)}
button[disabled]{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
select,textarea,input[type=text]{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
textarea{min-height:130px;resize:vertical}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;border:1px solid var(--line);background:var(--bg);color:var(--mut);margin-right:6px}
.pill.pri{background:var(--pri-soft);color:var(--pri);border-color:transparent}
.stem{white-space:pre-line}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--pri)}
.opt input{margin-top:.35em;width:1.1em;height:1.1em;flex:none}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt .l{font-weight:700;min-width:1.4em}
.opt.certa{border-color:var(--ok);background:var(--ok-soft)}
.opt.errada{border-color:var(--bad);background:var(--bad-soft)}
.opt.lock{cursor:default}
.cm{font-size:.9rem;color:var(--mut);margin:2px 0 0 0}
.q-img{max-width:100%;border-radius:8px;border:1px solid var(--line);margin:8px 8px 8px 0;max-height:420px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.nav button{min-width:40px;min-height:36px;padding:4px 8px;font-size:.85rem}
.nav button.done{background:var(--pri-soft);border-color:var(--pri)}
.nav button.flag{box-shadow:inset 0 -4px 0 var(--warn)}
.nav button.cur{outline:3px solid var(--ink)}
.conf button{flex:1;min-width:110px}
.conf button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri)}
.box{border-radius:10px;padding:10px 14px;margin:10px 0}
.box.ok{background:var(--ok-soft)} .box.bad{background:var(--bad-soft)} .box.warn{background:var(--warn-soft)} .box.info{background:var(--info-soft)}
.box b.t{display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--bg);position:sticky;top:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-height:520px}
.barrow{display:grid;grid-template-columns:minmax(120px,1.1fr) 3fr auto;gap:10px;align-items:center;margin:7px 0}
.bar{height:16px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%}
.bar i.g{background:var(--ok)} .bar i.a{background:#d49a00} .bar i.r{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{font-size:1.5rem;display:block;line-height:1.2}
.matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:.9rem}
.matrix div{padding:8px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.matrix .h{background:none;border:none;color:var(--mut);font-weight:600}
.chip{cursor:pointer}
.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
details summary{cursor:pointer;font-weight:600}
.hide{display:none}
.tag-err{color:var(--bad);font-weight:700} .tag-ok{color:var(--ok);font-weight:700} .tag-par{color:var(--warn);font-weight:700}
@media print{ .noprint,.topbar button{display:none!important} body{background:#fff;color:#000} .card{break-inside:avoid} }
@media (max-width:560px){ .barrow{grid-template-columns:1fr} }
</style>
</head>

F depende do tamanho."]], "nota": "O gabarito oficial aceita TIRADS 2 ou TIRADS 3 como corretas (marque uma delas).", "opcoes": [{"l": "A", "t": "TIRADS 4B"}, {"l": "B", "t": "TIRADS 4A"}, {"l": "C", "t": "TIRADS 2"}, {"l": "D", "t": "TIRADS 3"}], "certas": ["C", "D"], "comentarios": {"A": "Incorreta. TIRADS 4B indica suspeição moderada a alta e conduz à PAAF.", "B": "Incorreta. TIRADS 4A indica suspeição baixa a moderada e também conduz à investigação.", "C": "Correta segundo o gabarito oficial: categoria de baixa suspeição.", "D": "Correta segundo o gabarito oficial: categoria levemente suspeita."}}, {"n": 4, "area": "Nefrologia", "tema": "DRC: complicações e exame de monitorização", "assunto": "Doença renal crônica", "macro": "Nefrologia", "raciocinio": "Laboratório", "tipo": "aberta", "enunciado": "Cite três complicações da Doença Renal Crônica que devem ser monitorizadas no acompanhamento do paciente. Para cada complicação, cite um exame necessário para a monitorização.", "imagens": [], "conceito": "As complicações da DRC crescem com a queda da TFG: anemia, distúrbio mineral e ósseo (Ca, P, PTH, 25-OH- vitamina D), hipercalemia, acidose metabólica, hipervolemia e hipertensão, e, no estágio final, a uremia. Cada uma tem um exame ou parâmetro de acompanhamento.", "conduta": "Monitorizar: hemoglobina (anemia); cálcio, fósforo, PTH e 25-OH-vitamina D (DMO-DRC); potássio (hipercalemia); bicarbonato ou gasometria (acidose); pressão e edema (volume); sintomas urêmicos.", "pegadinha": "A pergunta pede complicação e exame correspondente: cite os dois. O PTH sozinho não monitoriza o distúrbio mineral, que exige também cálcio e fósforo.", "ref": "KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD (Kidney Int 2024;105(4S):S117-S314).", "cards": [["Cite exames de monitorização para as complicações da DRC.", "Anemia: {{c1::hemoglobina}}; distúrbio mineral e ósseo: {{c1::cálcio, fósforo, PTH e 25-OH-vitamina D}}; hipercalemia: {{c1::potássio}}; acidose: {{c1::bicarbonato ou gasometria}}."]], "nota": "", "esperada": "Anemia - dosagem de hemoglobina. Distúrbio mineral e ósseo da DRC - dosagem de cálcio, fósforo, PTH e 25-OH-vit D. Hipercalemia - dosagem de potássio sérico Acidose metabólica - coleta de gasometria venosa. Hipervolemia - medida de pressão, avaliação de edema e congestão pulmonar ao exame físico Uremia - investigação de sintomas como hiporexia, confusão mental, sitnomas de pericardite entre outros.", "partes": ["Complicação 1 e exame de monitorização", "Complicação 2 e exame de monitorização", "Complicação 3 e exame de monitorização"]}, {"n": 5, "area": "Hematologia", "tema": "Anemia hemolítica por deficiência de G6PD", "assunto": "Hematologia: hemólise, hemostasia e leucemia aguda", "macro": "Hematologia", "raciocinio": "Conduta", "tipo": "mcq", "enunciado": "Criança de 5 anos, sexo masculino, é medicado com sulfametoxazol-trimetropim por quadro de diarreia. Após dois dias inicia quadro de adinamia e icterícia. Exames revelam: Hb 8 g/L, 5700 leucócitos/mm3, 200 mil plaqueas/mm3, corpúsculos de Heinz em sangue periférico, ureia 30 mg/dL, creatinina 0,5 mg/dL, lactato desidrogenase 350 U/L (VR 60-170 U/L), haptoglobina 20 mg/dL (VR 32-197 mg/dL), Coombs direto negativo. Mãe refere episódios prévios semelhantes de anemia após infecções. Considerando a causa mais provável da anemia, o tratamento direcionado para a anemia deve ser realizado com:", "imagens": [], "conceito": "Criança com hemólise aguda após sulfa, icterícia, Coombs direto negativo, corpúsculos de Heinz e episódios prévios após infecções: deficiência de G6PD. A hemólise é oxidativa e autolimitada; não há tratamento específico.", "conduta": "Suspender o fármaco oxidante, hidratar, monitorizar; transfundir concentrado de hemácias se anemia grave ou instabilidade; aconselhar a evitar gatilhos (sulfas, nitrofurantoína, primaquina, favas).", "pegadinha": "Corticoide e imunoglobulina servem para hemólise autoimune (Coombs positivo); plasmaférese, para microangiopatia trombótica.", "ref": "Luzzatto L, Ally M, Notaro R. Glucose-6-phosphate dehydrogenase deficiency (Blood 2020;136:1225-1240). Harrison: Medicina Interna, 21ª ed. (2022).", "cards": [["Qual o tratamento da anemia hemolítica por deficiência de G6PD após sulfa?", "Não há tratamento específico: {{c1::suspender o fármaco oxidante}} e dar {{c1::suporte}}; corticoide e imunoglobulina são para hemólise {{c1::autoimune (Coombs positivo)}}."]], "nota": "", "opcoes": [{"l": "A", "t": "Tratamento de suporte"}, {"l": "B", "t": "Imunoglobulina endovenosa"}, {"l": "C", "t": "Prednisona 1mg/kg oral"}, {"l": "D", "t": "Plasmaférese"}], "certas": ["A"], "comentarios": {"A": "Correta. Não há tratamento específico; suspender a droga e dar suporte.", "B": "Incorreta. A imunoglobulina é útil em hemólise imune, e aqui o Coombs é negativo.", "C": "Incorreta. Corticoide trata a AHAI por anticorpos quentes (Coombs positivo).", "D": "Incorreta. A plasmaférese trata microangiopatias como a PTT."}, "feedback": "Caso sugestivo de deficiência de G6PD, para a qual não há tratamento específico, devendo adotar medidas para prevenir a hemólise (por exemplo evitando medicações associadas) e medidas de suporte durante os episódios de hemólise."}, {"n": 6, "area": "Endocrinologia", "tema": "Nódulo adrenal: washout e diagnóstico de adenoma", "assunto": "Adrenal e feocromocitoma", "macro": "Endocrinologia", "raciocinio": "Imagem", "tipo": "aberta", "enunciado": "Avaliação de Nódulo adrenal. A região de interesse delineada no nódulo adrenal demonstra uma densidade de 13 UH na aquisição sem contraste (A), 80 UH na fase portal venosa (B), e 36 UH na fase tardia(C). Esses valores correspondem a um washout relativo de 55% e absoluto de 66% Qual o seu diagnóstico? Justifique", "imagens": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk JRRRcBCdXfOdKvtyn5T5kGMf9/KbMmozx4k0O7aRfuOHgB/H95RRRcAVNR+yrFJol6zDnIlg4P8A38oRNThcGPRbxkx0aSHP/oyiii4WI/J1QjB0i+9P9bD/APHKgurLVNxMOhXU2R/HLAOf+/lFFFwOb1Lw/wCNNSyn9j3McJ/5ZfaYCP8A0Os3/hX/AInjUMugtJN03meAcfTfRRRcBreAPFUsqtNoc3ynho7mAHHuN9E3gLxaJ90Ohy+SRhlNxADn1+/RRQBHF4A8Yo5VtDcwknKNcQEj3B31vaR4I1CzXM2lX8bhty4mgYf+jKKKQFTxdo3xA1e3bTtJ8Pvb2R+9IbuBXk/8f4rhD8GfHmD/AMSH87yD/wCLoooBCf8ACmPHv/QB/wDJyD/4uiiigLn/2Q=="], "conceito": "Incidentaloma adrenal é o achado ao acaso de massa adrenal; o diagnóstico é definido pela imagem. Densidade sem contraste baixa (10 UH ou menos) indica adenoma rico em lipídeos; acima disso, o washout permite distinguir: absoluto de 60% ou mais e relativo de 40% ou mais sugerem adenoma. Neste caso: absoluto (80-36)/(80-13), cerca de 66%, e relativo (80-36)/80 = 55%.", "conduta": "Avaliar sempre a funcionalidade (cortisol após dexametasona 1 mg; metanefrinas se a densidade for maior que 10 UH; aldosterona/renina se hipertenso) e o risco de malignidade; lesões benignas pequenas não precisam de seguimento por imagem prolongado.", "pegadinha": "'Incidentaloma' nomeia o achado, e não a natureza da lesão: o diagnóstico é adenoma. Nas diretrizes recentes, densidade sem contraste de 10 UH ou menos pesa mais que o washout.", "ref": "Fassnacht M et al. ESE/ENSAT Guidelines on adrenal incidentalomas (Eur J Endocrinol 2023;189:G1-G42).", "cards": [["Como calcular e interpretar o washout de um nódulo adrenal?", "Densidade sem contraste de até {{c1::10 UH}} indica adenoma {{c1::rico em lipídeos}}; acima disso, washout absoluto e relativo {{c1::altos}} (calculados com as fases portal e tardia) sugerem adenoma."]], "nota": "", "esperada": "a. Adenoma - washout absoluto, com um limiar geralmente aceito maior que 60% e washout relativo maior que 40% maior a probabilidade de a lesão ser benigna", "partes": ["Diagnóstico: adenoma", "Justificativa: washout absoluto e relativo acima dos limiares (60% e 40%)"]}, {"n": 7, "area": "Nefrologia", "tema": "Estadiamento da DRC (KDIGO): TFG, albuminúria e risco", "assunto": "Doença renal crônica", "macro": "Nefrologia", "raciocinio": "Diagnóstico", "tipo": "multi", "enunciado": "Sobre o estadiamento da doença renal crônica assinale a(s) alternativa(s) correta(s): Você pode assinalar mais de uma alternativa como correta. Caso assinale um alternativa errada como correta, uma correta será anulada.", "imagens": [], "conceito": "O estadiamento da DRC combina a categoria de TFG (G1 a G5) e a de albuminúria (A1 menor que 30 mg/g; A2 30 a 300; A3 maior que 300). O risco de progressão e de eventos cardiovasculares aumenta na diagonal do mapa de calor; G1A3 já é de alto risco.", "conduta": "TFGe pela creatinina; a cistatina C é usada em conjunto (TFGe cr-cis) quando a creatinina é imprecisa ou a decisão é crítica, e não como regra universal. Repetir a albuminúria antes de classificar, pois infecção, febre e exercício a elevam falsamente.", "pegadinha": "A recomendação do KDIGO 2024 sobre cistatina C não é 'universal': ela complementa a creatinina em situações específicas.", "ref": "KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD (Kidney Int 2024;105(4S):S117-S314).", "cards": [["Como o KDIGO usa a cistatina C na estimativa da TFG?", "A cistatina C {{c1::complementa}} a creatinina (TFGe cr-cis) em situações específicas; {{c1::não}} é recomendação universal."], ["Quais fatores elevam falsamente a albuminúria?", "{{c1::Infecção}}, febre e {{c1::exercício físico}}; por isso repetir antes de classificar. G1A3 já é de alto risco."]], "nota": "Múltipla seleção: marcar item falso anula um certo (nota = certos menos errados).", "opcoes": [{"l": "A", "t": "O KDIGO 2024 trouxe uma mudança importante que é recomendação universal de avaliação inicial da estimativa da Taxa de Filtração Glomerular pela dosagem da Cistatina C."}, {"l": "B", "t": "Pacientes da categoria G1A3 tem alto risco de progressão"}, {"l": "C", "t": "Pacientes com albuminúria maior de 30mg/g são classificados como categoria A1."}, {"l": "D", "t": "Falsa elevação da albuminúria pode ocorrer em infecções e após exercício físico."}], "certas": ["B", "D"], "comentarios": {"A": "Incorreta. A cistatina C é indicada em situações específicas (creatinina pouco confiável), e não como avaliação inicial universal.", "B": "Correta. G1A3 tem alto risco pelo mapa de calor do KDIGO, porque a albuminúria acima de 300 mg/g pesa muito.", "C": "Incorreta. Albuminúria acima de 30 mg/g já sai da categoria A1 (A1 é menor que 30 mg/g).", "D": "Correta. Infecção, febre, exercício, ICC e hematúria podem elevar a albuminúria de forma transitória."}}, {"n": 8, "area": "Hematologia", "tema": "Leucemia promielocítica aguda (LPA): conduta de emergência", "assunto": "Hematologia: hemólise, hemostasia e leucemia aguda", "macro": "Hematologia", "raciocinio": "Conduta", "tipo": "multi", "enunciado": "No seu plantão na emergência do HGF você recebe a Aurora, 29 anos, vista na UPA do Canindezinho por quadro de petéquias e astenia e encaminhada ao HGF para avaliação urgente por conta dos seguintes resultados de exames complementares: -Hemograma: Hb: 8,9 g/dL; VCM: 96 fL; CHCM: 32 g/dL; Leucócitos: 4.300/mm3; Neutrófilos: 890/mm³; Linfócitos: 900/mm³; 58% de células de médio e grande porte, hipergranulares, com cromatina frouxa e nucléolos evidentes, compatíveis com blastos promielocíticos; Plaquetas de 27.000/mm³ -TAP: 30s; INR: 3,0 -TTPa: 45s; Rel. 1,8 -Fibrinogênio: 80 mg/dL (VR: 200-400 mg/dL) Exame físico revela apenas a presença de petéquias e equimoses em MMII, sem outros achados. Sinais vitais normais. Com base no caso descrito, quais das seguintes medidas você deve tomar já no primeiro atendimento no HGF? (Você pode marcar mais de um item como correto. Ao marcar um item errado você anulará um item correto)", "imagens": [], "conceito": "LPA é emergência hematológica: blastos promielocíticos hipergranulares, coagulopatia (CIVD com fibrinólise), fibrinogênio baixo, TAP e TTPa alterados, plaquetopenia. t(15;17) PML-RARA. Mortalidade precoce por hemorragia (SNC, pulmão).", "conduta": "Iniciar ATRA (ácido transretinóico) já na suspeita, sem aguardar a confirmação genética, e corrigir a coagulopatia: plaquetas (manter acima de 30 a 50 mil), plasma fresco e crioprecipitado (fibrinogênio acima de 150 mg/dL). Depois, ATO (trióxido de arsênio), com ou sem quimioterapia.", "pegadinha": "Dexametasona serve para a síndrome de diferenciação, e não para tratar LPA. Não se transfunde hemácias sem indicação, e antibiótico só se houver neutropenia febril.", "ref": "Sanz MA et al. Management of APL: ELN recommendations (Blood 2019;133:1630-1643). Sandes AF et al. Diagnósticos em Hematologia, 2ª ed. (2021).", "cards": [["Qual a conduta inicial na leucemia promielocítica aguda com coagulopatia?", "Iniciar {{c1::ATRA}} já na suspeita, sem esperar a genética; corrigir {{c1::plaquetas}}, plasma fresco e {{c1::crioprecipitado}} (fibrinogênio)."], ["Para que serve a dexametasona na LPA?", "Para a síndrome de {{c1::diferenciação}}; não trata a LPA nem a coagulopatia."]], "nota": "Múltipla seleção: marcar item falso anula um certo (nota = certos menos errados).", "opcoes": [{"l": "A", "t": "Ácido Tranexâmico"}, {"l": "B", "t": "Concentrado de hemácias"}, {"l": "C", "t": "Ácido transretinóico"}, {"l": "D", "t": "Piperacilina-Tazobactam (antibiótico com ação anti-pseudomonas)"}, {"l": "E", "t": "Transfusão de plaquetas"}, {"l": "F", "t": "Plasma fresco congelado (rico em fatores de coagulação)"}, {"l": "G", "t": "Crioprecipitado (rico em fibrinogênio)"}, {"l": "H", "t": "Dexametasona"}], "certas": ["C", "E", "F", "G"], "comentarios": {"A": "Incorreta. O ácido tranexâmico fica para sangramento ameaçador à vida, como medida de exceção.", "B": "Incorreta. Hb de 8,9 g/dL, oligossintomática, não indica transfusão de hemácias.", "C": "Correta. ATRA deve ser iniciado já na suspeita de LPA.", "D": "Incorreta. Antibiótico é reservado para neutropenia febril.", "E": "Correta. Plaquetopenia intensa, com sangramento e CIVD, exige reposição de plaquetas.", "F": "Correta. O plasma fresco repõe os fatores consumidos na coagulopatia.", "G": "Correta. Fibrinogênio de 80 mg/dL: repor com crioprecipitado.", "H": "Incorreta. Dexametasona trata a síndrome de diferenciação; não é citorredutor em leucemia mieloide."}, "feedback": "Pacientes com suspeita de Leucemia Promielocítica Aguda (LPA) devem ser tratados como tal devido à sua alta morbimortalidade e a melhora importante do prognóstico com o início do tratamento. Dessa forma, faz-se necessário o início do ATRA (ácido transretinóico) e o controle da coagulopatia associada à LPA com a transfusão de plaquetas, plasma fresco congelado e crioprecipitado. A paciente não apresenta critérios objetivos que justifiquem a transfusão de concentrado de hemácias, estando oligossintomática e com hemoglobina de 8,9. A dexametasona pode ser usada como agente citorredutor nas leucemias linfóides agudas, mas não no tratamento das leucemias mielóides. O uso da dexametasona reserva-se ao tratamento da síndrome de diferenciação relacionada ao ATRA, que não é o caso da paciente. O uso de antibióticos deve ser reservado a pacientes que fazem quadros de neutropenia febril. O ácido tranexâmico reserva-se aos pacientes com sangramento ameaçador à vida, como medida heróica, sem muita evidência."}, {"n": 9, "area": "Nefrologia / Anatomia Patológica", "tema": "Doença antimembrana basal glomerular: imunofluorescência linear", "assunto": "Glomerulopatias e síndromes nefrótica/nefrítica", "macro": "Nefrologia", "raciocinio": "Patologia", "tipo": "aberta", "enunciado": "Sobre os achados de imunofluorescência em biópsia renal na Doença de Goodpasture, responda:\nA) Qual dos padrões abaixo (1 ou 2) é o esperado de ser encontrado em um paciente acometido pela Doença de Goodpasture? (33% do valor da questão)\nB) Como é denominado esse padrão? (33% do valor da questão)\nC) Correlacione a fisiopatologia da Doença de Goodpasture com o seu padrão de imunofluo MBG e qual o mecanismo?", "Padrão {{c1::linear}}: autoanticorpos IgG contra a cadeia alfa-3 do {{c1::colágeno tipo IV}} depositam-se de forma contínua na MBG. Imunocomplexos dão padrão {{c1::granular}}."]], "nota": "", "esperada": "As imagens revelam dois padrões de deposição de imunocomplexos observáveis ao microscópio de imunofluorescência. Em (1) temos o padrão granular, característica da deposição de imunocomplexos circulantes e in situ. Já em (2) temos o padrão linear, característica clássica da glomerulonefrite por anticorpos antimembrana basal glomerular. Logo, a resposta ao item a) é “Imagem 2“ e a resposta ao item b) é “linear”. Quanto ao item c) sabemos que a Doença de Goodpasture é uma doença auto-imune cujos autoanticorpos são direcionados contra antígenos fixos na membrana basal glomerular (MBG), os quais “atacam” de forma homogênea a membrana que tem formato linear, reproduzindo o padrão linear de coloração quando visualizados na microscopia de imunofluorescência.", "partes": ["A) Padrão esperado: imagem 2", "B) Nome do padrão: linear", "C) Fisiopatologia: anticorpos anti-MBG ao longo da membrana, depósito contínuo, IF linear"]}, {"n": 10, "area": "Endocrinologia", "tema": "Hipotireoidismo primário: tratamento e controle", "assunto": "Tireoide: função e tireoidites", "macro": "Endocrinologia", "raciocinio": "Conduta", "tipo": "aberta", "enunciado": "Paciente do sexo feminino, 35 anos, apresentando ganho de peso e dislipidemia. Exames evidenciam TSH 20 mU/dL (VR 0,4 – 4,3 μUI/mL ) e T4L 0,4 ng/dL (VR 0,9 – 1,8ng/dl). Pergunta-se:\na)Qual o tratamento medicamentoso indicado?\nb)Qual exame deve ser solicitado para acompanhamento e em quanto tempo após o início do tratamento?", "imagens": [], "conceito": "TSH elevado com T4 livre baixo define hipotireoidismo primário (aqui, causa mais provável: tireoidite de Hashimoto).", "conduta": "Levotiroxina em dose plena, cerca de 1,6 mcg/kg/dia em adultos jovens sem cardiopatia, em jejum, longe de cálcio e ferro; reavaliar o TSH 6 a 8 semanas após iniciar ou ajustar a dose, depois a cada 6 a 12 meses.", "pegadinha": "O exame de controle é o TSH, e não o T3 ou o anti-TPO; e o intervalo é de 6 a 8 semanas, por causa da meia-vida longa do T4.", "ref": "Jonklaas J et al. ATA Guidelines for Treatment of Hypothyroidism (Thyroid 2014;24:1670-1751). Vilar L. Endocrinologia Clínica, 8ª ed.", "cards": [["Qual o tratamento e o controle do hipotireoidismo primário?", "{{c1::Levotiroxina}} cerca de 1,6 mcg/kg/dia; dosar o {{c1::TSH}} em {{c1::6 a 8 semanas}} após iniciar ou ajustar a dose."]], "nota": "", "esperada": "a) Levotiroxina 1,6mcg/kg/dia (não precisava colocar a dose). b) TSH em 6 a 8 semanas.", "partes": ["a) Levotiroxina", "b) Exame de controle: TSH", "b) Prazo: 6 a 8 semanas"]}, {"n": 11, "area": "Endocrinologia", "tema": "Coma mixedematoso: manejo inicial", "assunto": "Tireoide: função e tireoidites", "macro": "Endocrinologia", "raciocinio": "Conduta", "tipo": "mcq", "enunciado": "O coma mixedematoso representa manifestação clínica grave e temida, com taxa de mortalidade que pode atingir 40 a 50% sem tratamento adequado. Em relação a esta complicação, é correto afirmar:", "imagens": [], "conceito": "O coma mixedematoso é hipotireoidismo descompensado com alteração do nível de consciência, hipotermia, bradicardia, hiponatremia e hipoventilação, precipitado por infecção, frio, drogas ou abandono do tratamento. Mortalidade de 30 a 50%.", "conduta": "Tratar sem aguardar exames: levotiroxina IV (ataque de 200 a 400 mcg), com ou sem T3; hidrocortisona IV (100 mg a cada 8 h) antes ou junto, pelo risco de crise adrenal; suporte ventilatório, aquecimento passivo, tratar o fator precipitante.", "pegadinha": "Propiltiouracil é para tireotoxicose. O 'coma' nem sempre está presente (pode haver apenas confusão), e a reposição de T4 sem glicocorticoide pode precipitar crise adrenal.", "ref": "Jonklaas J et al. ATA Guidelines for Treatment of Hypothyroidism (Thyroid 2014;24:1670-1751). Harrison: Medicina Interna, 21ª ed. (2022).", "cards": [["Qual o manejo inicial do coma mixedematoso?", "{{c1::Levotiroxina IV}} sem esperar exames, com {{c1::hidrocortisona IV}} junto ou antes (risco de crise adrenal), suporte ventilatório e tratar o precipitante. Propiltiouracil é para {{c1::tireotoxicose}}."]], "nota": "", "opcoes": [{"l": "A", "t": "A mensuração laboratorial dos hormônios tireoidianos e cortisol deve guiar o tratamento, cujo início está condicionado aos seus resultados."}, {"l": "B", "t": "O risco de crise adrenal relacionada ao tratamento medicamentoso é um dos fatores que justifica a associação de glicocorticoides no manejo inicial."}, {"l": "C", "t": "O coma é critério clínico obrigatório para a suspeita e confirmação da complicação."}, {"l": "D", "t": "Por se tratar de complicação grave, o início do tratamento deve ser imediato e inclui Propiltiouracil em dose elevada."}], "certas": ["B"], "comentarios": {"A": "Incorreta. O tratamento não deve aguardar o resultado dos exames.", "B": "Correta. O glicocorticoide protege contra crise adrenal (hipotireoidismo grave, possível insuficiência adrenal associada).", "C": "Incorreta. O coma não é obrigatório; confusão mental já basta para suspeitar.", "D": "Incorreta. O PTU trata hipertireoidismo; no coma mixedematoso se usa levotiroxina."}, "feedback": "Trata-se de uma complicação do hipotiroidismo cujo tratamento envolve a reposição de levotiroxina e uso de glicocorticoide, sendo este justificado pelo risco associado de crise adrenal. O início do tratamento não deve aguardar o resultado dos exames laboratoriais. Apesar da nomenclatura, o coma nem sempre está presente, podendo haver outras alterações neurológicas, tais como confusão mental."}, {"n": 12, "area": "Nefrologia", "tema": "Glomerulopatia membranosa e neoplasias sólidas", "assunto": "Glomerulopatias e síndromes nefrótica/nefrítica", "macro": "Nefrologia", "raciocinio": "Diagnóstico", "tipo": "mcq", "enunciado": "Dentre as glomerulopatias abaixo, assinale a que se apresenta com proteinúria maciça e está mais frequentemente associada a neoplasias sólidas.", "imagens": [], "conceito": "Proteinúria maciça (síndrome nefrótica) associada a neoplasias sólidas (pulmão, cólon, mama, próstata) é típica da glomerulopatia membranosa, com espessamento difuso da MBG e depósitos subepiteliais (spikes à prata). Formas primárias: anti- PLA2R.", "conduta": "Na membranosa do adulto, dosar anti-PLA2R, rastrear neoplasia conforme idade e fatores de risco, tratar edema e proteinúria (IECA/BRA) e imunossupressão nos casos indicados.", "pegadinha": "Lesão mínima associa-se a linfoma de Hodgkin e AINEs; GESF a obesidade, HIV e heroína; nefropatia por IgA é nefrítica, com hematúria.", "ref": "KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases (Kidney Int 2021;100(4S):S1-S276). Kumar V, Abbas A, Aster J. Robbins & Cotran: Patologia, 10ª ed. (2023).", "cards": [["Qual glomerulopatia causa síndrome nefrótica e se associa a neoplasias sólidas?", "{{c1::Membranosa}} (depósitos subepiteliais, anti-PLA2R na primária). Lesão mínima associa-se a {{c1::linfoma de Hodgkin}} e AINEs; GESF, a obesidade e HIV."]], "nota": "", "opcoes": [{"l": "A", "t": "Nefropatia por IgA"}, {"l": "B", "t": "Lesão mínima"}, {"l": "C", "t": "Glomeruloesclerose Segmentar e Focal"}, {"l": "D", "t": "Glomerulopatia membranosa"}], "certas": ["D"], "comentarios": {"A": "Incorreta. A nefropatia por IgA se apresenta com hematúria, em geral sem proteinúria maciça.", "B": "Incorreta. A lesão mínima associa-se ao linfoma de Hodgkin, e não a tumores sólidos.", "C": "Incorreta. A GESF associa-se a obesidade, HIV, heroína e refluxo vesicoureteral.", "D": "Correta. A mais associada a neoplasias sólidas."}}, {"n": 13, "area": "Nefrologia", "tema": "DRC diabética: estadiamento e conduta", "assunto": "Doença renal crônica", "macro": "Nefrologia", "raciocinio": "Conduta", "tipo": "mcq", "enunciado": "Mulher, 71 anos, DM2 e HAS há mais de 20 anos. Na avaliação habitual com seu médico da APS queixou-se de fadiga, sonolência, tontura. Ao ser questionada sobre aspecto da urina citou presença de espuma. No exame físico foi detectado PA - 150x90mmHg, edema vespertino discreto de MMII (+/4+) e trouxe dosagem de creatinina sérica de 1,3 mg/dL (TFGe - 44 ml/min/1,73m²). Em nova avaliação, quatro meses mais tarde, a paciente apresenta-se com IMC - 35kg/m² e pressão arterial de 160 x 90 mmHg, sem outros dados positivos. Estava em uso de anlodipino 5mg/dia, metformina 2g/dia, gliclazida 60mg/d. A avaliação laboratorial nesta ocasião mostrou creatinina sérica de 1,4 mg/dL (TFGe - 40 ml/minuto), relação albumina/creatinina na urina de 320mg/g, glicemia de jejum - 150mg/dL, HbA1c - 8,5%, colesterol total - 190 HDL - 32 triglicérides - 200.", "imagens": [], "conceito": "TFGe de 40 (G3b) com albuminúria de 320 mg/g (A3): risco muito alto de progressão para DRC terminal. Pilares: IECA ou BRA em dose máxima tolerada, iSGLT2, controle glicêmico e pressórico, estatina; considerar finerenona no DM2 com albuminúria.", "conduta": "Iniciar IECA/BRA e iSGLT2; ajustar a metformina (TFGe de 30 a 44: reduzir para no máximo 1 g/dia); estatina de alta potência; encaminhar ao nefrologista pelo risco muito alto; pesquisar anemia e distúrbio mineral conforme o estágio.", "pegadinha": "Em DRC, o risco de eventos cardiovasculares e de progressão é decidido por TFG e albuminúria juntas; não é 'intermediário' com A3.", "ref": "KDIGO 2022 Clinical Practice Guideline for Diabetes Management in CKD (Kidney Int 2022;102(5S):S1-S127). KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD (Kidney Int 2024;105(4S):S117-S314).", "cards": [["Quais as medidas centrais no DM2 com DRC G3b A3?", "{{c1::IECA ou BRA}}, {{c1::iSGLT2}}, estatina de alta potência, ajuste da {{c1::metformina}} (máximo 1 g/dia com TFGe de 30 a 44) e encaminhar ao nefrologista."]], "nota": "", "opcoes": [{"l": "A", "t": "Pelo estadiamento atual da sua doença, e como a paciente vem apresentando queixas sugestivas de anemia, precisa ser avaliado o seu hemograma e a cinética do ferro, ficando a avaliação de outras complicações da DRC para o momento que a paciente apresente os sintomas específicos das mesmas."}, {"l": "B", "t": "Por esta paciente ter alto risco de desenvolver doença renal terminal e, dentre as complicações da DRC, a hipercalemia ser a mais temida por ser a principal responsável pela morte dos pacientes, é importante que desde já sejam instituídas medidas para prevenção da mesma."}, {"l": "C", "t": "Pelo estadiamento atual da doença renal desta paciente, ela tem muito alto risco de evolução para doença renal terminal e necessita fazer mudanças na sua terapêutica com otimização do controle das doenças de base, início de BRA ou IECA e de iSGLT2; além disso precisa fazer ajuste na dose da metformina e iniciar estatina de alta potência."}, {"l": "D", "t": "Essa paciente está num estadiamento intermediário da sua doença renal, devendo manter seguimento apenas na atenção primária em saúde, com medidas para melhora do controle glicêmico com uso de insulina e melhora da dieta. Além disso deve iniciar sinvastatina e AAS. No momento não há necessidade de referenciamento para o especialista."}], "certas": ["C"], "comentarios": {"A": "Incorreta. Anemia é uma das complicações a rastrear, mas não a única; outras devem ser avaliadas conforme o estágio.", "B": "Incorreta. A hipercalemia é frequente, mas a prevenção não é o único foco; a maior parte da mortalidade é cardiovascular.", "C": "Correta. Risco muito alto: otimizar a terapia (IECA/BRA, iSGLT2, metformina ajustada, estatina).", "D": "Incorreta. Com A3 e G3b o risco é muito alto, exigindo nefrologista e insulina não é o ponto principal."}}, {"n": 14, "area": "Nefrologia / Anatomia Patológica", "tema": "Massa abdominal na infância: tumor de Wilms", "assunto": "Litíase e tumores renais", "macro": "Nefrologia", "raciocinio": "Imagem", "tipo": "aberta", "enunciado": "Paciente sexo F, 5 anos, apresentando aumento do volume abdominal acompanhada de emagrecimento. Sem outras queixas. A mãe palpou massa abdominal, levando a criança a uma emergência, onde realizou uma Tomografia Computadorizada do Abdome mostrada na figura. Cite 3 caracteristicas da imagem e apresente um provável diagnóstico.", "imagens": [], "conceito": "O tumor de Wilms (nefroblastoma) é o tumor renal mais comum da infância, entre 2 e 5 anos, em geral massa abdominal assintomática, com hematúria e hipertensão ocasionais. Associa-se a WAGR, Denys-Drash e Beckwith-Wiedemann. Na TC, massa sólida, expansiva e hipodensa, com componente do rim, sem contraste homogêneo.", "conduta": "Ultrassom e TC de abdome e tórax; nefrectomia com quimioterapia (SIOP: pré-operatória; COG: cirurgia primária). Não biopsiar por via percutânea a princípio, pelo risco de disseminação.", "pegadinha": "Carcinoma de células renais é do adulto; em criança pequena com massa renal sólida, pense em Wilms. Neuroblastoma desloca o rim e calcifica, sem se originar dele.", "ref": "Kumar V, Abbas A, Aster J. Robbins & Cotran: Patologia, 10ª ed. (2023). Nelson: Tratado de Pediatria, 21ª ed.", "cards": [["Qual o tumor renal mais comum da infância e como aparece na TC?", "{{c1::Tumor de Wilms}} (nefroblastoma), de 2 a 5 anos: massa abdominal {{c1::sólida, expansiva e hipodensa}}; tratar com nefrectomia e quimioterapia, sem biópsia percutânea."]], "nota": "A tomografia citada não está no arquivo original da prova; o caso se resolve pelo texto (menina de 5 anos, massa abdominal).", "esperada": "1.lesão sólida, expansiva, hipodensa 2.Tu de Wilms", "partes": ["Característica 1 da imagem", "Característica 2 da imagem", "Característica 3 da imagem", "Diagnóstico: tumor de Wilms"]}, {"n": 15, "area": "Endocrinologia", "tema": "Hipotireoidismo subclínico na gestação", "assunto": "Tireoide: função e tireoidites", "macro": "Endocrinologia", "raciocinio": "Conduta", "tipo": "mcq", "enunciado": "Paciente de 24 anos, grávida, com idade gestacional 10 semanas, assintomática, comparece à UAPS para consulta de pré-natal trazendo exame de TSH = 7 μUI/mL (VR 0,4 – 4,3 μUI/mL ) e T4L 1,1 ng/dL (VR 0,9 – 1,8ng/dl). Em relação ao caso, é correto afirmar que se trata de:", "imagens": [], "conceito": "TSH elevado com T4 livre normal na gestação é hipotireoidismo subclínico. Na gravidez, o intervalo de referência do TSH é menor (limite superior em torno de 4 no primeiro trimestre) e a doença se associa a aborto e prejuízo neurocognitivo fetal.", "conduta": "Conduta do gabarito: tratar com levotiroxina, por estar grávida, com meta de TSH abaixo de 2,5 no primeiro trimestre (ou no limite inferior a intermediário do intervalo de referência da gestação). A ATA 2017 valoriza o anti-TPO nos casos leves, mas com TSH elevado como o deste caso (7) o tratamento é a regra.", "pegadinha": "Nem sintomas nem o TSH acima de 10 são exigidos para tratar na gravidez. A alternativa que condiciona ao anti-TPO é defensável pela ATA em TSH pouco elevado, mas o gabarito oficial é 'tratar por estar grávida'.", "ref": "Alexander EK et al. ATA Guidelines for Thyroid Disease in Pregnancy (Thyroid 2017;27:315-389). Vilar L. Endocrinologia Clínica, 8ª ed.", "cards": [["Qual a conduta no hipotireoidismo subclínico (TSH elevado, T4 livre normal) na gestação?", "Tratar com {{c1::levotiroxina}} por estar grávida, com meta de TSH abaixo de {{c1::2,5}} no primeiro trimestre; não exige sintomas nem TSH acima de 10."]], "nota": "", "opcoes": [{"l": "A", "t": "Hipotireoidismo subclínico e a paciente não precisa ser tratada por estar assintomática."}, {"l": "B", "t": "Hipotireoidismo subclínico e a paciente deve ser tratada se tiver altos títulos de anti-TPO."}, {"l": "C", "t": "Hipotireoidismo subclínico e a paciente deve ser tratada por estar grávida."}, {"l": "D", "t": "Hipotireoidismo subclínico e não há indicação de tratamento exceto quando TSH > 10 μUI/mL."}], "certas": ["C"], "comentarios": {"A": "Incorreta. Ausência de sintomas não dispensa o tratamento na gestação.", "B": "Incorreta segundo o gabarito. O anti-TPO reforça a indicação, mas não é condição necessária quando o TSH está elevado.", "C": "Correta segundo o gabarito oficial: o hipotireoidismo subclínico gestacional é tratado por estar grávida.", "D": "Incorreta. O limite de 10 é o da população não gestante, com TPO negativo."}}, {"n": 16, "area": "Nefrologia", "tema": "Síndrome nefrítica: características etiológicas", "assunto": "Glomerulopatias e síndromes nefrótica/nefrítica", "macro": "Nefrologia", "raciocinio": "Fisiopatologia", "tipo": "mcq", "enunciado": "Sobre as características etiológicas da síndrome nefrítica, qual alternativa é correta?", "imagens": [], "conceito": "Síndrome nefrítica: hematúria dismórfica, cilindros hemáticos, hipertensão, edema, oligúria e queda da TFG. Complemento baixo: GNPE, membranoproliferativa (C3), lúpus, crioglobulinemia. Complemento normal: IgA, anti-MBG, ANCA.", "conduta": "Dosar C3, C4, ASLO, FAN, ANCA e anti-MBG; biópsia conforme o quadro. A nefropatia por IgA é a glomerulopatia primária mais comum no mundo e provoca episódios de hematúria macroscópica 1 a 3 dias após infecção respiratória (sinfaringítica).", "pegadinha": "Anti-MBG e IgA têm complemento normal; GNPE é mais comum na infância, não em adultos.", "ref": "KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases (Kidney Int 2021;100(4S):S1-S276). Kumar V, Abbas A, Aster J. Robbins & Cotran: Patologia, 10ª ed. (2023).", "cards": [["Quais síndromes nefríticas têm complemento normal e quais têm baixo?", "Normal: {{c1::IgA}}, anti-MBG e ANCA. Baixo: {{c1::GNPE}}, membranoproliferativa, lúpus e crioglobulinemia."]], "nota": "", "opcoes": [{"l": "A", "t": "A glomerulonefrite membranoproliferativa geralmente apresenta complemento sérico normal."}, {"l": "B", "t": "A Síndrome de Goodpasture (doença antimembrana basal glomerular) apresenta complemento sérico diminuído."}, {"l": "C", "t": "A glomerulonefrite pós-estreptocócica tem maior prevalência em adultos do que em crianças."}, {"l": "D", "t": "A nefropatia por IgA é a principal causa de síndrome nefrítica recorrente em adultos jovens."}], "certas": ["D"], "comentarios": {"A": "Incorreta. A membranoproliferativa costuma ter C3 baixo.", "B": "Incorreta. Na doença anti-MBG o complemento é normal.", "C": "Incorreta. A GNPE é mais prevalente em crianças.", "D": "Correta. IgA: hematúria macroscópica recorrente, após infecção respiratória ou gastrointestinal."}, "feedback": "A nefropatia por IgA é uma das causas mais comuns de hematúria recorrente com síndrome nefrítica em adultos jovens, particularmente associada a infecções respiratórias ou gastrointestinais."}, {"n": 17, "area": "Anatomia Patológica / Endocrinologia", "tema": "Carcinoma papilífero da tireoide: patologia", "assunto": "Tireoide: nódulo e câncer", "macro": "Endocrinologia", "raciocinio": "Patologia", "tipo": "mcq", "enunciado": "Considerando a fisiopatologia e os achados citopatológicos e histopatológicos do carcinoma papilífero da tireoide (CPT), assinale a alternativa CORRETA:", "imagens": [], "conceito": "O CPT vem das células foliculares, não produz hormônio em excesso (o paciente costuma estar eutireóideo) e o diagnóstico se baseia nas alterações nucleares: aumento e sobreposição, cromatina em vidro fosco, sulcos e pseudoinclusões. Pode ou não formar papilas (variante folicular).", "conduta": "PAAF do nódulo suspeito, tireoidectomia, com radioiodo e supressão do TSH conforme risco, e tireoglobulina no seguimento.", "pegadinha": "Células parafoliculares e calcitonina são do carcinoma medular; hipertireoidismo é raro no CPT.", "ref": "Kumar V, Abbas A, Aster J. Robbins & Cotran: Patologia, 10ª ed. (2023). Haugen BR et al. ATA Guidelines (Thyroid 2016;26:1- 133).", "cards": [["Em que se baseia o diagnóstico do carcinoma papilífero da tireoide?", "Nas alterações {{c1::nucleares}} (vidro fosco, sulcos, pseudoinclusões); pode ou não formar papilas. A origem é folicular, e a calcitonina é do {{c1::medular}}."]], "nota": "", "opcoes": [{"l": "A", "t": "Por ser originada das células foliculares da tireóide, costuma cursar com aumento da secreção dos hormônios tireoidianos como o T3 e o T4."}, {"l": "B", "t": "O CPT pode formar ou não papilas, uma vez que o diagnóstico citopatológico e histopatológico na verdade se baseiam nas alterações nucleares próprias."}, {"l": "C", "t": "Por ser originada das células parafoliculares da tireóide, o CPT costuma cursar com aumento da secreção de calcitonina."}, {"l": "D", "t": "Por definição, o CPT sempre forma papilas, ainda que apenas pequenas e focais."}], "certas": ["B"], "comentarios": {"A": "Incorreta. O CPT geralmente é não funcionante.", "B": "Correta. O diagnóstico se apoia em características nucleares; papilas podem faltar.", "C": "Incorreta. Células parafoliculares e calcitonina são do carcinoma medular.", "D": "Incorreta. Há variantes sem papilas (como a folicular)."}}, {"n": 18, "area": "Anatomia Patológica / Nefrologia", "tema": "Carcinoma de células renais: subtipos", "assunto": "Litíase e tumores renais", "macro": "Nefrologia", "raciocinio": "Patologia", "tipo": "mcq", "enunciado": "Sobre os Carcinomas de Células Renais (CCRs) e seus subtipos, assinale a sentença CORRETA:", "imagens": [], "conceito": "Os três subtipos mais comuns do carcinoma de células renais: células claras (o mais comum, com perda de VHL em 3p), papilar e cromófobo. A classificação ainda é morfológica e de crescimento, embora a genética avance.", "conduta": "Nefrectomia parcial ou radical para doença localizada; terapia sistêmica (inibidores de checkpoint, antiangiogênicos) na doença avançada.", "pegadinha": "O prognóstico do cromófobo é melhor que o do de células claras; o papilar é mais multifocal e bilateral que os demais.", "ref": "Kumar V, Abbas A, Aster J. Robbins & Cotran: Patologia, 10ª ed. (2023).", "cards": [["Quais os três subtipos mais comuns de carcinoma de células renais?", "{{c1::Células claras}} (mais comum), {{c1::papilar}} (mais multifocal e bilateral) e {{c1::cromófobo}} (menos comum, melhor prognóstico)."]], "nota": "", "opcoes": [{"l": "A", "t": "Os carcinomas de células claras constituem o tipo mais comum e que apresenta o melhor prognóstico. Microscopicamente, são compostos por células com citoplasma claro."}, {"l": "B", "t": "Apesar dos avanços recentes na compreensão da base genética dos carcinomas renais, as neoplasias de células renais ainda são tradicionalmente classificadas com base nos padrões de morfologia e crescimento, com as três formas mais comuns sendo o carcinoma de células claras, o carcinoma papilar e o carcinoma cromófobo."}, {"l": "C", "t": "Os carcinomas papilares são definidos por seu padrão de crescimento papilar. Dentre os CCRs mais comuns, é a neoplasia que menos se apresenta com multifocalidade ou bilateralidade."}, {"l": "D", "t": "Dentre as três formas mais comun de CCRs, os carcinomas renais cromófobos são os menos comuns. Seu nome deriva da observação de que a coloração das células tumorais é mais escura, refletindo em maior atipia celular e, consequentemente, pior prognóstico entre os CCRs."}], "certas": ["B"], "comentarios": {"A": "Incorreta. Células claras são as mais comuns, mas não têm o melhor prognóstico (cromófobo é melhor).", "B": "Correta. A classificação continua morfológica, com três subtipos principais.", "C": "Incorreta. O papilar é justamente o que mais mostra multifocalidade e bilateralidade.", "D": "Incorreta. O cromófobo é o menos comum, mas tem melhor prognóstico; suas células têm citoplasma claro-pálido com membrana evidente."}}, {"n": 19, "area": "Medicina de Família / Hematologia", "tema": "Linfonodomegalia: sinais de alerta para neoplasia", "assunto": "Clínica geral (consumptiva, linfonodomegalia)", "macro": "Clínica geral", "raciocinio": "Diagnóstico", "tipo": "multi", "enunciado": "Na avaliação das linfonodomegalias, qual(is) dos sinais e sintomas abaixo são considerados sinais de alerta para a possibilidade de etiologia neoplásica? (mais de uma alternativa pode ser correta, uma resposta incorreta anula uma correta):", "imagens": [], "conceito": "Sinais de alerta para etiologia neoplásica: idade acima de 40 anos, linfonodo duro, fixo e indolor, maior que 2 cm, cadeia supraclavicular, generalizada ou com sintomas B (febre prolongada, sudorese noturna, perda de peso), evolução persistente (mais de 4 a 6 semanas).", "conduta": "Linfonodos persistentes ou com alertas: hemograma, LDH, sorologias, imagem e biópsia excisional. Supraclavicular esquerda: pense em neoplasia abdominal (Virchow).", "pegadinha": "Idade menor que 40 e início recente favorecem causa reativa ou infecciosa.", "ref": "Harrison: Medicina Interna, 21ª ed. (2022). Ferrer R. Lymphadenopathy: differential diagnosis and evaluation (Am Fam Physician 1998;58:1313-1320).", "cards": [["Quais sinais de alerta de linfonodomegalia sugerem neoplasia?", "Idade acima de {{c1::40}} anos, linfonodo duro, fixo, indolor e maior que 2 cm, cadeia {{c1::supraclavicular}}, febre prolongada e evolução persistente."]], "nota": "Múltipla seleção: marcar item falso anula um certo (nota = certos menos errados).", "opcoes": [{"l": "A", "t": "Idade do paciente menor que 40 anos."}, {"l": "B", "t": "Associação com febre prolongada."}, {"l": "C", "t": "Linfonodomegalia na cadeia supraclavicular."}, {"l": "D", "t": "Linfonodomegalia de início há 2 semanas."}], "certas": ["B", "C"], "comentarios": {"A": "Incorreta. O alerta é a idade acima de 40 anos.", "B": "Correta. Febre prolongada (sintoma B) sugere linfoma ou outra neoplasia.", "C": "Correta. Linfonodo supraclavicular tem alta chance de malignidade.", "D": "Incorreta. Início recente é mais típico de causa reativa ou infecciosa."}}, {"n": 20, "area": "Nefrologia", "tema": "Síndrome nefrótica: diagnóstico sindrômico e manejo inicial", "assunto": "Glomerulopatias e síndromes nefrótica/nefrítica", "macro": "Nefrologia", "raciocinio": "Conduta", "tipo": "aberta", "enunciado": "Paciente, masculino, 25 anos, deu entrada na UPA com quadro de edema de face e membros inferiores progressivo associado a redução do volume urinário e urina espumosa. Nega dispneia aos esforços, dispneia paroxística noturna, ortopneia. Nega doenças prévias ou uso de medicações. Ao exame apresenta PA 100 x 75mmHg, FC=80 bpm, FR= 18 irpm, T= 36°C. Peso habitual 70kg, peso atual 85 kg. BEG, eupneico, corado, hidratado, acianótico, anictérico. BRNF sem sopro, ritmo regular em 2T. Exame pulmonar alterado em terço inferior do HTD (Murmúrio vesicular diminuído, macicez, FTV reduzido). Abdome globoso e ascítico. Edema de MMII até raiz de coxa, com sinal de cacifo, sem calor, sem rubor, sem dor. Nega história familiar de doença renal. Sumário de urina evidenciou: Proteinúria +++, Hemoglobina negativa, Leucócitos negativo. Proteinúria de 24h de 5000 mg/24h, Colesterol total de 530 com LDL de 290. 1) Qual o mais completo diagnóstico sindrômico para este caso? 2) Qual conduta terapêutica para o manejo inicial deste paciente. Cite 03 intervenções (tratamento medicamentoso ou não medicamentoso).", "imagens": [], "conceito": "Síndrome nefrótica: proteinúria acima de 3,5 g/24 h, hipoalbuminemia, edema, dislipidemia e lipidúria. Complicações: tromboembolismo, infecções, injúria renal aguda.", "conduta": "Restrição de sódio, diurético de alça, IECA ou BRA (antiproteinúrico), estatina, anticoagulação profilática se albumina abaixo de 2,5 g/dL e risco, vacinas (influenza e pneumococo), e biópsia no adulto para definir a causa.", "pegadinha": "Derrame pleural e edema sem sinais de congestão cardíaca apontam para causa renal; 'nefrítica' tem hematúria e hipertensão, sem proteinúria maciça.", "ref": "KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases (Kidney Int 2021;100(4S):S1-S276). Harrison: Medicina Interna, 21ª ed. (2022).", "cards": [["Qual o manejo inicial da síndrome nefrótica do adulto?", "{{c1::Restrição de sódio}}, diurético de {{c1::alça}}, {{c1::IECA ou BRA}}, estatina, anticoagulação profilática se albumina abaixo de {{c1::2,5}} g/dL, vacinas, e biópsia para definir a causa."]], "nota": "", "esperada": "1) Síndrome nefrótica 2) Condutas iniciais: - Restrição hidrossalina - Diurético de alça – furosemida - Inibidores de ECA ou BRA - Anticoagulação profilática se albumina menor que 2,5 g/dl - Vacinação influenza, pneumococo, pelo risco aumentado de infeções", "partes": ["1) Síndrome nefrótica", "2) Conduta 1", "2) Conduta 2", "2) Conduta 3"]}, {"n": 21, "area": "Endocrinologia / Pediatria", "tema": "Hipotireoidismo congênito: triagem neonatal", "assunto": "Tireoide: função e tireoidites", "macro": "Endocrinologia", "raciocinio": "Laboratório", "tipo": "mcq", "enunciado": "Sobre o diagnóstico do hipotireoidismo congênito, assinale a alternativa correta:", "imagens": [], "conceito": "O hipotireoidismo congênito é a principal causa evitável de deficiência intelectual. A triagem neonatal (teste do pezinho) dosa TSH entre o 3º e o 5º dia de vida; o resultado alterado é confirmado com TSH e T4 livre séricos.", "conduta": "Confirmar rapidamente e iniciar levotiroxina sem esperar (idealmente antes de 14 dias de vida); pesquisar a causa (cintilografia ou US) sem atrasar o tratamento.", "pegadinha": "Coletar antes de 48 horas de vida pode falsear (pico fisiológico do TSH); o teste detecta as formas primárias, e não as centrais.", "ref": "Brasil. Ministério da Saúde. Manual de Normas Técnicas: Triagem Neonatal. Vilar L. Endocrinologia Clínica, 8ª ed.", "cards": [["Quando é feito o teste do pezinho para hipotireoidismo congênito e como se confirma?", "Entre o {{c1::3º e o 5º dia}} de vida, dosando {{c1::TSH}}; confirma-se com TSH e T4 livre séricos e inicia-se a levotiroxina sem demora."]], "nota": "", "opcoes": [{"l": "A", "t": "O teste do pezinho mede diretamente os níveis de TSH no sangue do recém-nascido, e valores elevados indicam a necessidade de investigação adicional, mas o diagnóstico definitivo é feito apenas após o primeiro ano de vida."}, {"l": "B", "t": "A dosagem do TSH pelo teste do pezinho pode ser suprimida nos primeiros dias de vida, sendo necessário repetir o exame no primeiro mês de vida em recém nascidos com risco de desenvolver hipotireoidismo congênito."}, {"l": "C", "t": "No Brasil, o teste do pezinho só detecta casos graves de hipotireoidismo congênito, sendo necessária a repetição do exame aos 6 meses de vida para detectar casos mais brandos."}, {"l": "D", "t": "O teste do pezinho, realizado entre o 3º e o 5º dia de vida, pode detectar níveis elevados de TSH, sugerindo hipotireoidismo congênito. O diagnóstico é confirmado por meio de dosagens séricas de TSH e T4 livre, permitindo intervenção precoce."}], "certas": ["D"], "comentarios": {"A": "Incorreta. O diagnóstico é confirmado nas primeiras semanas, e não após o primeiro ano.", "B": "Incorreta. O TSH não é suprimido; o exame é feito entre o 3º e o 5º dia de vida.", "C": "Incorreta. O teste detecta os casos de todas as gravidades, sem repetir aos 6 meses.", "D": "Correta. Teste do pezinho, entre o 3º e o 5º dia; confirmação por TSH e T4L."}}, {"n": 22, "area": "Nefrologia", "tema": "DRC: avaliação, rastreamento e mecanismos de progressão", "assunto": "Doença renal crônica", "macro": "Nefrologia", "raciocinio": "Diagnóstico", "tipo": "mcq", "enunciado": "Em relação à Doença Renal Crônica (DRC), marque o correto:", "imagens": [], "conceito": "O rastreamento da DRC usa creatinina (TFGe) e albuminúria (RAC), e não apenas o sumário de urina. O US sugere DRC pela hiperecogenicidade e perda da diferenciação corticomedular, com rins frequentemente reduzidos. A progressão envolve hiperfiltração e aumento da pressão intraglomerular nos néfrons remanescentes.", "conduta": "Rastrear com TFGe e albuminúria; US de rins; biópsia apenas quando a causa não é clara (não na maioria dos casos).", "pegadinha": "A pressão intraglomerular aumenta (e não diminui) nos néfrons remanescentes; é o alvo do IECA, BRA e iSGLT2.", "ref": "KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD (Kidney Int 2024;105(4S):S117-S314).", "cards": [["Como se rastreia a DRC e qual o mecanismo de progressão?", "Com {{c1::TFGe pela creatinina}} e {{c1::albuminúria}}. Nos néfrons remanescentes há {{c1::aumento}} da pressão intraglomerular (hiperfiltração), alvo de IECA, BRA e iSGLT2."]], "nota": "", "opcoes": [{"l": "A", "t": "A biópsia renal é necessária na avaliação etiológica da maioria dos casos de DRC, sobretudo dos pacientes com diabetes, em que a biópsia revela sinais de glomeruloesclerose característicos."}, {"l": "B", "t": "O rastreamento da DRC deve ser feito, idealmente, através da dosagem da creatinina para estimativa da TFG e da coleta de sumário de urina."}, {"l": "C", "t": "A presença de DRC é sugerida ao US por aumento da ecogenicidade cortical e perda da diferenciação cortico-medular, com rins frequentemente diminuídos de tamanho."}, {"l": "D", "t": "Independente da causa da DRC, entre os mecanismos de progressão da doença está uma redução da pressão intraglomerular, com prejuízo da filtração de cada glomérulo remanescente."}], "certas": ["C"], "comentarios": {"A": "Incorreta. A biópsia não é necessária na maioria dos casos de DRC; em diabéticos a causa costuma ser presumida.", "B": "Incorreta. O rastreamento inclui a albuminúria (RAC), e não apenas a creatinina e o sumário.", "C": "Correta segundo o gabarito oficial: US com ecogenicidade cortical aumentada e perda da diferenciação corticomedular.", "D": "Incorreta. Nos néfrons remanescentes há aumento da pressão intraglomerular e hiperfiltração, e não redução."}}, {"n": 23, "area": "Nefrologia", "tema": "Injúria renal aguda por aciclovir", "assunto": "Injúria renal aguda", "macro": "Nefrologia", "raciocinio": "Diagnóstico", "tipo": "mcq", "enunciado": "Paciente sexo feminino, 65 anos, com histórico de hipertensão arterial sistêmica e diabetes mellitus tipo 2, apresenta-se ao pronto-socorro com queixa de edema generalizado e diminuição da diurese nas últimas 48 horas. Relata estar no quarto dia de tratamento para Herpes Zóster com aciclovir por via oral. No exame físico, observa-se pressão arterial de 150/90 mmHg, frequência cardíaca de 95 bpm e sinais de estase jugular. O exame laboratorial revela creatinina sérica (Cr) de 1,9 mg/dL, ureia (Ur) de 60 mg/dL, e a urina apresenta densidade de 1010 e proteína urinária de 1+, mas sem hematúria visível. Exames prévios de 1 mês antes do quadro atual da paciente mostravam Cr de 1,2 mg/dL. Baseado no caso acima, responda qual a principal hipótese diagnóstica e abordagem mais adequada:", "imagens": [], "conceito": "Elevação de creatinina de 1,2 para 1,9 mg/dL em um mês, oligúria e edema, com sedimento pobre (proteinúria discreta, sem hematúria) sob aciclovir: injúria renal aguda medicamentosa. O aciclovir causa nefropatia por cristais, sobretudo com desidratação e doses altas.", "conduta": "Suspender ou ajustar o fármaco nefrotóxico, avaliar volemia (aqui há congestão), monitorizar diurese e função renal, descartar obstrução; diálise apenas por indicações clássicas.", "pegadinha": "Não basta ver 'creatinina alta' para pensar em DRC: o histórico recente mostra mudança aguda (critérios KDIGO), e a proteinúria de 1+ sem hematúria não define nefrítica ou nefrótica.", "ref": "KDIGO Clinical Practice Guideline for Acute Kidney Injury (Kidney Int Suppl 2012;2:1-138). Harrison: Medicina Interna, 21ª ed. (2022).", "cards": [["Como reconhecer a injúria renal aguda por aciclovir?", "Creatinina sobe em dias, sedimento {{c1::pobre}}, uso de {{c1::aciclovir}} (nefropatia por cristais, risco maior com desidratação); suspender ou ajustar e monitorizar diurese."]], "nota": "", "opcoes": [{"l": "A", "t": "Injúria renal aguda provavelmente relacionada a toxicidade medicamentosa, devendo-se suspender o aciclovir e manter monitorização do débito urinário da paciente."}, {"l": "B", "t": "Doença renal crônica, evoluindo com piora da função renal devido às suas condições de base, e a principal conduta seria ajustar a dose dos anti-hipertensivos."}, {"l": "C", "t": "Síndrome nefrítica de provável etiologia autoimune, devendo-se iniciar corticoterapia o mais rápido possível e programar realização de biópsia renal."}, {"l": "D", "t": "Síndrome nefrótica provavelmente relacionada ao DM2, devendo-se associar diuréticos de alça e otimizar a dose de IECA, com posterior programação de biópsia renal."}], "certas": ["A"], "comentarios": {"A": "Correta. IRA por aciclovir: suspender e monitorar.", "B": "Incorreta. Houve piora aguda em relação ao valor de 1 mês antes, o que caracteriza IRA, e não DRC.", "C": "Incorreta. Não há hematúria, cilindros hemáticos ou proteinúria de faixa nefrítica que sustentem síndrome nefrítica.", "D": "Incorreta. Proteinúria de 1+ sem hipoalbuminemia não define síndrome nefrótica."}}, {"n": 24, "area": "Endocrinologia", "tema": "Hipotireoidismo central: monitorização da reposição", "assunto": "Tireoide: função e tireoidites", "macro": "Endocrinologia", "raciocinio": "Laboratório", "tipo": "mcq", "enunciado": "Qual das seguintes afirmações abaixo é verdadeira em relação ao acompanhamento da reposição hormonal tireoidiana em pacientes com hipotireoidismo central?", "imagens": [], "conceito": "No hipotireoidismo central (hipofisário ou hipotalâmico) o TSH é baixo, normal ou pouco alterado e não é um bom marcador de reposição. O acompanhamento é feito pelo T4 livre, que se mantém na metade superior do intervalo de referência.", "conduta": "Levotiroxina; T4 livre 6 a 8 semanas após iniciar ou ajustar a dose, depois a cada 6 a 12 meses; repor glicocorticoide antes da levotiroxina se houver insuficiência adrenal associada.", "pegadinha": "Aqui o TSH não guia o ajuste; T3 não reflete a suficiência de reposição, e T4 total sofre interferência das proteínas ligadoras.", "ref": "Persani L. Central hypothyroidism (J Clin Endocrinol Metab 2012;97:3068-3078). Jonklaas J et al. ATA Guidelines for Treatment of Hypothyroidism (Thyroid 2014;24:1670-1751).", "cards": [["Qual exame monitoriza a reposição no hipotireoidismo central?", "O {{c1::T4 livre}}, em 6 a 8 semanas após ajuste; o {{c1::TSH}} não serve de guia. Repor {{c1::glicocorticoide}} antes se houver insuficiência adrenal."]], "nota": "", "opcoes": [{"l": "A", "t": "O TSH dosado a cada 3 meses é o exame mais confiável para monitorar a eficácia do tratamento no hipotireoidismo central."}, {"l": "B", "t": "Após estabilização dos níveis de T4 total, o acompanhamento pode ser realizado a cada 3 meses, com exames de T4 total e TSH."}, {"l": "C", "t": "A reposição hormonal deve ser ajustada com base nos níveis de T3 total a cada 3 meses, pois este exame reflete diretamente a disponibilidade do hormônio ativo."}, {"l": "D", "t": "A dosagem de T4 livre deve ser realizada inicialmente a cada 6 a 8 semanas após a introdução da levotiroxina, até que os níveis se estabilizem."}], "certas": ["D"], "comentarios": {"A": "Incorreta. O TSH não é confiável no hipotireoidismo central.", "B": "Incorreta. O T4 total sofre interferência das proteínas ligadoras e o TSH não é bom parâmetro.", "C": "Incorreta. O T3 vem da conversão periférica e não reflete bem a suficiência de reposição.", "D": "Correta. T4 livre 6 a 8 semanas após a introdução e até estabilizar."}, "feedback": "Embora o TSH seja um marcador importante em muitos casos de hipotireoidismo, em pacientes com hipotireoidismo central, ele não é um indicador confiável para monitoramento, pois os níveis podem permanecer alterados devido à disfunção hipofisária. O T3 (triiodotironina) é produzido principalmente a partir da conversão do T4 (tiroxina) nos tecidos periféricos. Assim, os níveis de T3 total ou livre podem não refletir adequadamente a função tireoidiana global. O T4 total não é o exame de escolha para monitorar a eficácia da terapia em pacientes com pan-hipopituitarismo, pois a presença de proteínas ligadoras pode interferir nos resultados. O T4 livre é mais indicativo da função tireoidiana ativa."}, {"n": 25, "area": "Nefrologia", "tema": "DRC: tratamento e controle pressórico", "assunto": "Doença renal crônica", "macro": "Nefrologia", "raciocinio": "Conduta", "tipo": "mcq", "enunciado": "Sobre o tratamento de pacientes com Doença Renal Crônica, é correto afirmar:", "imagens": [], "conceito": "Após IECA ou BRA, a TFG pode cair até 30%, sem indicar suspensão (efeito hemodinâmico esperado); acima disso, investigar estenose de artéria renal e hipovolemia. Na DRC com albuminúria, IECA ou BRA são a classe de escolha; no DM2 com DRC, metformina (ajustada), iSGLT2 e agonista de GLP-1.", "conduta": "Meta de PAS abaixo de 120 mmHg (medida padronizada) se tolerada, segundo o KDIGO 2021; IECA ou BRA se albuminúria; iSGLT2 se TFGe de 20 ou mais.", "pegadinha": "iDPP4 não reduz a progressão da DRC; bloqueadores de canal de cálcio não são a primeira escolha com albuminúria.", "ref": "KDIGO 2021 Clinical Practice Guideline for the Management of Blood Pressure in CKD (Kidney Int 2021;99(3S):S1-S87). KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD (Kidney Int 2024;105(4S):S117-S314).", "cards": [["O que fazer se a TFG cai após iniciar IECA ou BRA?", "Queda {{c1::discreta}} da TFG é esperada e {{c1::não}} suspende o fármaco; queda maior: investigar {{c1::estenose de artéria renal}} e hipovolemia. Com albuminúria, a classe de escolha é {{c1::IECA ou BRA}}."]], "nota": "", "opcoes": [{"l": "A", "t": "A meta geral de pressão arterial na DRC é menor do que 140 x 90 mmHg, pois controle mais rigoroso está associado a hipoperfusão renal e maior risco de eventos adversos nesta população."}, {"l": "B", "t": "Após o início de inibidores da ECA e bloqueadores de receptor de angiotensina pode haver redução de taxa de filtração glomerular de até 30%, mas isso não deve levar à suspensão da medicação."}, {"l": "C", "t": "A classe de drogas de escolha para o tratamento do diabetes em pacientes com DRC é a dos inibidores de DPP4, por reduzirem progressão de doença renal."}, {"l": "D", "t": "A classe de drogas de escolha para o tratamento da hipertensão em paciente com albuminúria é a dos bloqueadores de canal de cálcio."}], "certas": ["B"], "comentarios": {"A": "Incorreta. A meta do KDIGO 2021 é PAS abaixo de 120 mmHg quando tolerada.", "B": "Correta. Queda de até 30% da TFG é esperada e não obriga a suspender.", "C": "Incorreta. iSGLT2, metformina (ajustada) e GLP-1 têm mais benefício; iDPP4 não reduz a progressão.", "D": "Incorreta. Com albuminúria, a classe de escolha é IECA ou BRA."}}, {"n": 26, "area": "Hematologia", "tema": "Anemias hemolíticas: exames diagnósticos", "assunto": "Hematologia: hemólise, hemostasia e leucemia aguda", "macro": "Hematologia", "raciocinio": "Laboratório", "tipo": "mcq", "enunciado": "Sobre os exames complementares no diagnóstico das anemias hemolíticas, assinale a opção correta", "imagens": [], "conceito": "Na hemólise: reticulocitose, LDH e bilirrubina indireta elevadas, haptoglobina baixa (consumida pela hemoglobina livre), Coombs direto conforme a causa e esfregaço com alterações morfológicas (esferócitos, esquizócitos, células em foice, corpúsculos de Heinz).", "conduta": "Hemograma com reticulócitos, esfregaço, LDH, bilirrubinas, haptoglobina, Coombs direto e exames de acordo com a suspeita.", "pegadinha": "Haptoglobina cai (não sobe) na hemólise; a icterícia é à custa de bilirrubina indireta; a anemia é hiperproliferativa (reticulocitose).", "ref": "Harrison: Medicina Interna, 21ª ed. (2022). Sandes AF et al. Diagnósticos em Hematologia, 2ª ed. (2021).", "cards": [["Quais os achados laboratoriais da anemia hemolítica?", "{{c1::Reticulocitose}}, LDH e bilirrubina {{c1::indireta}} elevados, haptoglobina {{c1::baixa}}, Coombs direto conforme a causa e esfregaço característico."]], "nota": "", "opcoes": [{"l": "A", "t": "Quando ocorre a hemólise há liberação da hemoglobina, que pode se ligar a haptoglobina no plasma, o que justifica o aumento dos seus níveis séricos"}, {"l": "B", "t": "A presença de icterícia é uma manifestação clínica comum em casos de anemia hemolítica, em que o paciente pode apresentar altos níveis de bilirrubina, as custas principalmente de bilirrubina direta"}, {"l": "C", "t": "A observação do esfregaço de sangue periférico é essencial para avaliar o aspecto morfológico eritrócitário que pode ser característico de algumas etiologias"}, {"l": "D", "t": "Geralmente encontramos anemia do tipo hipoproliferativa, com diminuição do Volume Corpuscular Médio e altos níveis de anisocitose."}], "certas": ["C"], "comentarios": {"A": "Incorreta. A haptoglobina se liga à hemoglobina livre e seus níveis diminuem.", "B": "Incorreta. A icterícia da hemólise é por bilirrubina indireta.", "C": "Correta. O esfregaço orienta a etiologia.", "D": "Incorreta. É anemia hiperproliferativa, com reticulocitose; o VCM tende a normal ou alto."}}, {"n": 27, "area": "Anatomia Patológica / Nefrologia", "tema": "Glomerulopatias: padrões histológicos e técnicas", "assunto": "Glomerulopatias e síndromes nefrótica/nefrítica", "macro": "Nefrologia", "raciocinio": "Patologia", "tipo": "mcq", "enunciado": "Sobre as glomerulopatias, seus padrões histopatológicos e técnicas diagnósticas, assinale a alternativa CORRETA:", "imagens": [], "conceito": "Na nefropatia diabética, a glomeruloesclerose nodular tem os nódulos de Kimmelstiel-Wilson (não de Reed- Sternberg, que são do linfoma de Hodgkin) e afeta também vasos e túbulos. A amiloide é amorfa, eosinofílica, e o diagnóstico exige o vermelho congo com birrefringência verde-maçã à luz polarizada.", "conduta": "Suspeita de amiloidose: vermelho congo (ou tipagem por imuno-histoquímica ou espectrometria de massa); HE, PAS e tricrômico sozinhos não confirmam.", "pegadinha": "Reed-Sternberg é do Hodgkin; Kimmelstiel-Wilson, do diabetes. A nefropatia diabética afeta também arteríolas (hialinose) e túbulos.", "ref": "Kumar V, Abbas A, Aster J. Robbins & Cotran: Patologia, 10ª ed. (2023).", "cards": [["Qual o nódulo da nefropatia diabética e como se confirma amiloidose?", "Nódulos de {{c1::Kimmelstiel-Wilson}} (Reed-Sternberg é do Hodgkin); amiloide: vermelho {{c1::congo}} com birrefringência {{c1::verde-maçã}} à luz polarizada."]], "nota": "", "opcoes": [{"l": "A", "t": "Uma das apresentações da nefropatia diabética é a glomeruloesclerose nodular, quando ficam evidentes os nódulos de Reed-Sternberg no interior dos glomérulos."}, {"l": "B", "t": "Por mecanismos ainda não totalmente elucidados, a nefropatia diabética ou vai se apresentar como esclerose mesangial difusa ou como esclerose nodular, afetando significativamente os glomérulos, mas poupando túbulos e vasos sanguíneos."}, {"l": "C", "t": "O material amilóide, depositado nos mais diferentes tecidos, sempre apresenta-se como um material amorfo sob as mais diferentes colorações. Somente na coloração de vermelho congo que o material amilóide vai apresentar característica diagnóstica específica, que é a birrefringência verde maçã sob a luz polarizada."}, {"l": "D", "t": "O uso concomitante das colorações de Hematoxilina-Eosina (HE), Ácido Periódico de Schiff (PAS) e Tricrômico de Masson permite o diagnóstico de amiloidose renal, mesmo sem o uso da coloração de Vermelho Congo."}], "certas": ["C"], "comentarios": {"A": "Incorreta. Os nódulos da nefropatia diabética são os de Kimmelstiel-Wilson; Reed-Sternberg é do linfoma de Hodgkin.", "B": "Incorreta. A nefropatia diabética afeta também os vasos (hialinose arteriolar) e túbulos.", "C": "Correta. O diagnóstico é pelo vermelho congo com birrefringência verde-maçã.", "D": "Incorreta. Sem o vermelho congo, o diagnóstico de amiloidose não é firmado."}}, {"n": 28, "area": "Nefrologia", "tema": "IRA pré-renal: índices urinários e sanguíneos", "assunto": "Injúria renal aguda", "macro": "Nefrologia", "raciocinio": "Laboratório", "tipo": "multi", "enunciado": "Na Injúria Renal Aguda (IRA), quais dos achados laboratoriais listados abaixo são sugestivos de etiologia pré-renal? (Você pode marcar mais de um item como correto. Assinalar uma resposta errada como correta anula uma correta).", "imagens": [], "conceito": "Na IRA pré-renal os rins reabsorvem sódio e ureia avidamente: FENa menor que 1%, FEureia menor que 35%, relação ureia/creatinina maior que 40, urina concentrada, sedimento normal ou cilindros hialinos. Na necrose tubular aguda, FENa maior que 2%, FEureia maior que 50% e cilindros granulosos.", "conduta": "Tratar a causa (hipovolemia, baixo débito, drogas): volume ou suspensão do fármaco; a FEureia é útil quando o paciente usa diurético.", "pegadinha": "FENa maior que 2% e proteinúria acima de 500 mg/24 h sugerem lesão tubular ou glomerular, e não pré-renal.", "ref": "KDIGO Clinical Practice Guideline for AKI (Kidney Int Suppl 2012;2:1-138). Harrison: Medicina Interna, 21ª ed. (2022).", "cards": [["Quais índices sugerem IRA pré-renal?", "FENa {{c1::baixa}}, FEureia {{c1::baixa}}, relação ureia/creatinina {{c1::maior que 40}} e urina concentrada; FENa alta sugere {{c1::necrose tubular aguda}}."]], "nota": "Múltipla seleção: marcar item falso anula um certo (nota = certos menos errados).", "opcoes": [{"l": "A", "t": "Proteinúria >500mg/24h."}, {"l": "B", "t": "Fração de excreção de ureia <35%."}, {"l": "C", "t": "Fração de excreção de sódio >2%."}, {"l": "D", "t": "Relação ureia plasmática/creatinina plasmática >40."}], "certas": ["B", "D"], "comentarios": {"A": "Incorreta. Proteinúria acima de 500 mg/24 h sugere lesão glomerular.", "B": "Correta. FEureia menor que 35% é típica de IRA pré-renal.", "C": "Incorreta. FENa maior que 2% sugere necrose tubular aguda; na pré-renal é menor que 1%.", "D": "Correta. Relação ureia/creatinina maior que 40 sugere pré-renal."}, "feedback": "Na IRA pré-renal, econtramos fração de excreção de ureia <35% e relação ur/cr>40."}, {"n": 29, "area": "Endocrinologia", "tema": "Hipotireoidismo por Hashimoto: ultrassom da tireoide", "assunto": "Tireoide: função e tireoidites", "macro": "Endocrin atosa aguda.", "B": "Incorreta. Rim reduzido e hiperecogênico é padrão de doença crônica.", "C": "Correta segundo o gabarito oficial.", "D": "Incorreta. Não é o padrão compatível com o quadro, segundo o gabarito."}}, {"n": 31, "area": "Endocrinologia", "tema": "Crise adrenal em insuficiência adrenal primária", "assunto": "Adrenal e feocromocitoma", "macro": "Endocrinologia", "raciocinio": "Conduta", "tipo": "mcq", "enunciado": "Paciente do sexo feminino, 21 anos, solteira, chega na UPA, com queixa de astenia, anorexia, emagrecimento de cerca de 5 Kg, hipotensão, dores abdominais e hiperpigmentação, com 2 meses de evolução. Sem antecedentes pessoais de doenças ou uso de medicações. Na admissão a doente apresentava-se em mal estado geral, deprimida, com hiperpigmentação na face, linhas interdigitais da palma das mãos e nos lábios, PA: 80 x 44 mmHg, FC: 110 bpm e afebril. A ausculta cardíaca e pulmonar e a palpação abdominal eram normais. Os exames revelaram: hemoglobina: 12.8 g/dL, leucócitos: 7.400/L (42% de linfócitos, 49% de neutrófilos, 5% de eosinófilos, 4% de monócitos e 0% de basófilos), plaquetas: 264.000/L, VHS: 11 mm, sódio: 135 meq/L, potássio: 5,6 meq/L e glicose: 80 mg/dL. Considerando a principal hipótese diagnóstica para o caso acima, qual alternativa apresenta as duas medidas terapêuticas iniciais mais importantes para a doença de base?", "imagens": [], "conceito": "Hiperpigmentação, astenia, emagrecimento, dor abdominal, hipotensão e hipovolemia sugerem insuficiência adrenal primária (Addison) em crise, com hiponatremia e hipercalemia. A causa mais comum é autoimune.", "conduta": "Na crise: hidratação venosa com soro fisiológico e hidrocortisona IV (100 mg em bolus, depois 50 mg a cada 6 h), sem aguardar exames; depois manutenção com hidrocortisona ou prednisona e fludrocortisona, e investigar a causa (anticorpo anti-21-hidroxilase).", "pegadinha": "Fludrocortisona é reposição crônica, não emergência; levotiroxina antes do glicocorticoide pode precipitar crise adrenal.", "ref": "Bornstein SR et al. Primary Adrenal Insufficiency: Endocrine Society Guideline (J Clin Endocrinol Metab 2016;101:364-389).", "cards": [["Quais as duas medidas iniciais na crise adrenal?", "{{c1::Hidratação venosa}} com soro fisiológico e {{c1::hidrocortisona IV}} (100 mg em bolus, depois 50 mg de 6 em 6 h); a {{c1::fludrocortisona}} é reposição crônica."]], "nota": "", "opcoes": [{"l": "A", "t": "Hidratação venosa e Fludrocortisona"}, {"l": "B", "t": "Hidratação Venosa e Hidrocortisona"}, {"l": "C", "t": "Prednisona e Fludrocortisona"}, {"l": "D", "t": "Hidrocortisona e Levotiroxina"}], "certas": ["B"], "comentarios": {"A": "Incorreta. A fludrocortisona é reposição crônica; a emergência exige glicocorticoide em dose alta.", "B": "Correta. Hidratação venosa e hidrocortisona são as duas medidas iniciais.", "C": "Incorreta. Prednisona oral não é a escolha na crise.", "D": "Incorreta. Levotiroxina não trata a crise; dada antes do glicocorticoide pode agravá-la."}}, {"n": 32, "area": "Hematologia", "tema": "Doença de von Willebrand tipo 3: sangramento mucoso", "assunto": "Hematologia: hemólise, hemostasia e leucemia aguda", "macro": "Hematologia", "raciocinio": "Conduta", "tipo": "mcq", "enunciado": "Você está atendendo na UPA quando chega a paciente Maria, 15 anos, portadora de doença de von Willebrand Tipo 3. A mesma relata que caiu quando estava andando de bicicleta e apresenta uma laceração em lábio inferior há 1 hora. A lesão apresenta sangramento leve a moderado, mas a paciente relata que foi orientada a procurar atendimento médico sempre que o sangramento fosse muito prolongado. Qual alternativa apresenta a medida farmacológica de primeira linha para conter o sangramento atual de Maria", "imagens": [], "conceito": "Na doença de von Willebrand (DvW) tipo 3 há ausência quase total do FVW, com FVIII muito baixo; a desmopressina não funciona (não há FVW para liberar). Sangramentos mucosos leves respondem a antifibrinolíticos.", "conduta": "Sangramento leve em mucosa: ácido tranexâmico (oral, tópico ou IV). Sangramento maior ou cirurgia: concentrado de FVW/FVIII.", "pegadinha": "Desmopressina serve nos tipos 1 e 2A, e não no tipo 3; FVIII recombinante isolado não repõe o FVW.", "ref": "Connell NT et al. ASH ISTH NHF WFH 2021 Guidelines on von Willebrand Disease (Blood Adv 2021;5:301-325).", "cards": [["Qual a medida de primeira linha para sangramento mucoso leve na doença de von Willebrand tipo 3?", "{{c1::Ácido tranexâmico}}; a {{c1::desmopressina}} não funciona no tipo 3 (não há FVW para liberar). Sangramento maior: concentrado de {{c1::FVW/FVIII}}."]], "nota": "", "opcoes": [{"l": "A", "t": "Desmopressina"}, {"l": "B", "t": "Ácido Tranexâmico"}, {"l": "C", "t": "Concentrado de plaquetas"}, {"l": "D", "t": "Concentrado de fator VIII recombinante"}], "certas": ["B"], "comentarios": {"A": "Incorreta. No tipo 3 não há FVW para liberar; a desmopressina não é eficaz.", "B": "Correta. Sangramento mucoso leve: antifibrinolítico.", "C": "Incorreta. O defeito não é plaquetário.", "D": "Incorreta. O FVIII recombinante não repõe o FVW, que é o fator deficiente."}, "feedback": "Por se tratar de um sangramento mucoso leve, devemos iniciar o uso de antifibrinolíticos, como o ácido tranexâmico. Pacientes com DvW tipo 3 não respondem à desmopressina."}, {"n": 33, "area": "Endocrinologia / Anatomia Patológica", "tema": "Histopatologia de Hashimoto e Graves e correlação clínica", "assunto": "Tireoide: função e tireoidites", "macro": "Endocrinologia", "raciocinio": "Patologia", "tipo": "aberta", "enunciado": "Tireoidite de Hashimoto e Doença de Graves são duas doenças autoimunes que afetam a glândula tireoide. Na imagem abaixo temos uma fotomicrografia dos achados histopatológicos da Tireoidite de Hashimoto à esquerda e da Doença de Graves à direita. Com base nestas informações, correlacione as características histopatológicas de CADA doença com o seu quadro clínico MAIS característico de hipotireoidismo ou hipertireo
